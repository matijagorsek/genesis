<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Genesis default faces: Inter for the interface, IBM Plex Mono for code -->
  <alias binding="same"><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>IBM Plex Mono</family><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
