# The root of a bootc machine is a composefs overlay, and the installer writes it into fstab with "ro". At
# boot systemd tries to re-apply those options and the kernel answers "overlay: No changes allowed in
# reconfigure": a failed unit on every boot of every Genesis machine, doing nothing. Not attempted where
# it cannot succeed. /boot and /boot/efi are mounted by their own units and are not affected.
[Unit]
ConditionPathExists=!/run/ostree-booted
