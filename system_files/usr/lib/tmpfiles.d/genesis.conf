# Genesis state directories (systemd-tmpfiles)
d /var/lib/genesis            2775 genesis-ai genesis-users -
d /var/lib/genesis/models     2775 genesis-ai genesis-users -
d /var/lib/genesis/packs      0755 genesis-ai genesis-ai    -
d /var/cache/genesis          0750 genesis-ai genesis-ai    -
d /run/genesis                0755 genesis-ai genesis-users -
# Plasma Setup (out-of-box account wizard) is replaced by the installer and the Genesis first-run wizard.
f /etc/plasma-setup-done 0644 root root - genesis
# Babel: the debugpy extension writes a small endpoint file next to itself, which lives under read-only /usr
d /tmp/.babel-debugpy 1777 root root -
