# The model servers' saved openings (--slot-save-path): a job's fixed opening, read once and restored in a
# few hundredths of a second on every later boot and model reload (decision 233). The model service's own;
# a file nobody has restored for 30 days is removed, which is how an opening that changed is let go.
d /var/lib/genesis/slots 0750 genesis-ai genesis-ai 30d
