# bootc-image-builder config for the qcow2 TEST DISKS only (boot tests, the dev VM, the canary, the evaluation).
# The installer ISO uses config-iso.toml, which has no default account and no SSH gate.
# Docs: https://github.com/osbuild/bootc-image-builder

# Hostname comes from the image (bootc kargs.d: systemd.hostname=genesis); the builder rejects a hostname customization for qcow2.

# Test user for the boot tests. Never in the ISO.
[[customizations.user]]
name = "genesis"
password = "genesis"
groups = ["wheel"]

# Serial console so headless boot tests can read the log.
[customizations.kernel]
append = "console=ttyS0,115200 console=tty0 genesis.devssh=1"

# Note: bootc-image-builder refuses [[customizations.user]] together with custom kickstart content,
# so no kickstart block here. Anaconda asks for disk, locale and user; the test user above is also created.
