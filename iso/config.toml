# bootc-image-builder config for Genesis. Used for anaconda-iso, qcow2 and raw outputs.
# Docs: https://github.com/osbuild/bootc-image-builder

[customizations]
hostname = "genesis"

# Test user for boot tests and first alpha. The first-run wizard replaces this in Phase 1.
[[customizations.user]]
name = "genesis"
password = "genesis"
groups = ["wheel"]

# Serial console so headless boot tests can read the log.
[customizations.kernel]
append = "console=ttyS0,115200 console=tty0"

# Note: bootc-image-builder refuses [[customizations.user]] together with custom kickstart content,
# so no kickstart block here. Anaconda asks for disk, locale and user; the test user above is also created.
