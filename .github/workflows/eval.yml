name: eval

# Ten small makes on the tiny pack (CPU only, the 2B model) inside fresh VMs of the latest release,
# scored. The number moves when the prompts, the tools or the compact script change, so a change that
# helps or hurts small models shows up here rather than in a feeling. Nothing is published; the results
# are an artifact and the job summary.
#
# Two things keep the wait short enough to act on. The makes are split over parallel machines, so the run
# takes as long as its slowest shard instead of the sum of all ten. And when the change under test is in
# genesis-agentd, the binary is built here and dropped into the last release's VM, which skips the hour
# the image build costs. The weekly run does neither of those tricks: it tests the image as it shipped.

on:
  schedule:
    - cron: '15 4 * * 0'
  workflow_dispatch:
    inputs:
      agentd_from_source:
        description: 'build genesis-agentd from this commit and drop it into the last release (fast); false tests the release as it shipped'
        type: boolean
        default: true
      shards:
        description: 'how many machines to split the ten makes over'
        default: '5'
      releases_back:
        description: 'which release to test (0 = latest)'
        default: '0'
      speculation:
        description: 'on = the router as rendered; off = its --spec-type flags removed, to measure what speculation does to the makes'
        default: 'on'
      set:
        description: 'basic = the ten small makes; hard = changing an existing project, fixing a bug, a follow-up, a backend with its page; chat = seven questions with checkable answers'
        default: 'basic'
      pack:
        description: 'tiny = the 2B on 6 GB (the smallest machines); cpu = the 4B and 9B coder on 13 GB, what a laptop with no GPU runs'
        default: 'tiny'
      agentd_env:
        description: 'extra environment for the maker under test, KEY=VALUE separated by spaces (e.g. GENESIS_NO_COMPLETION_CHECK=1)'
        default: ''

permissions:
  contents: read

jobs:
  # The binary under test, when it is agentd that changed. Skipped for the weekly run.
  agentd:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.agentd_from_source == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      # built on an older glibc than the image carries, which is the direction that works
      - run: |
          cargo build --release --manifest-path src/genesis-agentd/Cargo.toml
          cargo build --release --manifest-path src/genesis-firstrun/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: agentd-binary
          path: |
            src/target/release/genesis-agentd
            src/target/release/genesis-firstrun
          retention-days: 1

  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.s.outputs.shards }}
      count: ${{ steps.s.outputs.count }}
    steps:
      - id: s
        env:
          N: ${{ github.event.inputs.shards || '5' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = max(1, min(10, int(os.environ["N"])))
          print("shards=" + json.dumps(list(range(n))))
          print("count=%d" % n)
          PY

  makes:
    needs: [plan, agentd]
    if: always() && needs.plan.result == 'success' && needs.agentd.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: The binary under test, if one was built
        if: needs.agentd.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: agentd-binary
          path: newbin
      - name: Fetch the release disk
        env:
          GH_TOKEN: ${{ github.token }}
          BACK: ${{ github.event.inputs.releases_back || '0' }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          tag=$(gh release list --repo ${{ github.repository }} --limit 40 --json tagName --jq '[.[]|select(.tagName|test("^v0\\."))]|.['"$BACK"'].tagName')
          echo "testing $tag"; echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo ${{ github.repository }} --pattern 'genesis-*.qcow2.zst.*.part' -D dl
          cat $(ls dl/genesis-*.qcow2.zst.*.part | grep -v arm64 | sort) | zstd -d -o disk.qcow2; rm -rf dl
      - name: KVM and firmware
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf sshpass
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm; sudo chmod 0666 /dev/kvm || true
          # the CPU pack is about 13 GB of models; the tiny pack 2.6
          if [ "${{ github.event.inputs.pack || 'tiny' }}" = cpu ]; then qemu-img resize disk.qcow2 +28G; else qemu-img resize disk.qcow2 +16G; fi
          df -h . | tail -1
      - name: Boot, install the tiny pack, run this shard's makes
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ needs.plan.outputs.count }}
          SPECULATION: ${{ github.event.inputs.speculation || 'on' }}
          PACK: ${{ github.event.inputs.pack || 'tiny' }}
          SET: ${{ github.event.inputs.set || 'basic' }}
          AGENTD_ENV: ${{ github.event.inputs.agentd_env }}
        run: |
          set -o pipefail
          FW=/usr/share/ovmf/OVMF.fd; [ -f "$FW" ] || FW=/usr/share/OVMF/OVMF.fd
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else ACCEL="-cpu max"; fi
          # the CPU pack's coder is a 9B: a machine that runs it has 16 GB; the runner has 16, so 13 is what fits
          MEM=6144; [ "$PACK" = cpu ] && MEM=13312
          nohup qemu-system-x86_64 $ACCEL -m $MEM -smp 4 -nographic -bios "$FW" \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
            -serial file:eval-serial.log -display none -monitor none >qemu.out 2>&1 &
          QEMU=$!
          vm() { sshpass -p genesis ssh -p 2222 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR genesis@127.0.0.1 "$@"; }
          for i in $(seq 1 120); do vm true 2>/dev/null && break; kill -0 $QEMU 2>/dev/null || { echo "QEMU exited"; tail -5 qemu.out; exit 1; }; sleep 10; done
          vm 'grep --color=never ^IMAGE_VERSION= /etc/os-release'
          # the first-run wizard answers once its service is up; then the tiny pack through its own API
          # (the model files come from GHCR or Hugging Face)
          # The wizard writes the router config when a pack is chosen, so the binary under test has to be in
          # place before the choice, not after it. /usr is read-only on a bootc image; /etc is not, and a
          # system drop-in there points the unit at the new binary without touching the image.
          if [ -f newbin/genesis-firstrun ]; then
            vm 'cat > /tmp/genesis-firstrun && chmod +x /tmp/genesis-firstrun' < newbin/genesis-firstrun
            vm 'echo genesis | sudo -S sh -c "mkdir -p /etc/systemd/system/genesis-firstrun.service.d && install -m755 /tmp/genesis-firstrun /usr/local/bin/genesis-firstrun && printf \"[Service]\\nExecStart=\\nExecStart=/usr/local/bin/genesis-firstrun\\n\" > /etc/systemd/system/genesis-firstrun.service.d/under-test.conf && systemctl daemon-reload && systemctl restart genesis-firstrun"'
            echo "the wizard under test is the build from this commit"
          fi
          for i in $(seq 1 60); do vm 'curl -s -m 10 127.0.0.1:11510/api/state' | grep -q '"packs"' && break; sleep 5; done
          t_choose=$(date +%s)
          vm 'T=$(echo genesis | sudo -S cat /run/genesis/firstrun.token 2>/dev/null); curl -s -m 20 -H "X-Genesis-Token: $T" -H "Content-Type: application/json" -d "{\"pack\":\"'"$PACK"'\",\"force\":true}" 127.0.0.1:11510/api/choose; echo'
          for i in $(seq 1 120); do vm 'curl -s -m 10 -H "Authorization: Bearer $(cat /etc/genesis/router.key 2>/dev/null)" 127.0.0.1:8080/v1/models' 2>/dev/null | grep -q '"fast"' && { echo "small model serving $(( $(date +%s) - t_choose )) s after the choice"; break; }; sleep 10; done
          for i in $(seq 1 240); do
            st=$(vm 'curl -s -m 10 127.0.0.1:11510/api/state' | python3 -c 'import sys,json; p=json.load(sys.stdin).get("progress",{}); print(p.get("state",""), p.get("error","") or "")' 2>/dev/null || echo "?")
            echo "  $st"
            case "$st" in done*) break;; error*) echo "download failed"; break;; *) sleep 15;; esac
          done
          # the maker under test: the binary built from this commit replaces the one the release carries
          # /usr is read-only on a bootc image, so the binary goes to the user's own bin and a drop-in
          # points the service at it; the image on disk is left exactly as it shipped
          if [ -f newbin/genesis-agentd ]; then
            vm 'mkdir -p ~/.local/bin ~/.config/systemd/user/genesis-agentd.service.d; cat > ~/.local/bin/genesis-agentd && chmod +x ~/.local/bin/genesis-agentd' < newbin/genesis-agentd
            vm 'printf "[Service]\nExecStart=\nExecStart=%s/.local/bin/genesis-agentd serve\n" "$HOME" > ~/.config/systemd/user/genesis-agentd.service.d/under-test.conf; systemctl --user daemon-reload'
            for kv in $AGENTD_ENV; do vm "printf 'Environment=%s\\n' '$kv' >> ~/.config/systemd/user/genesis-agentd.service.d/under-test.conf"; echo "maker under test with $kv"; done
            vm 'systemctl --user daemon-reload'
            vm 'ls -l ~/.local/bin/genesis-agentd; echo "the maker under test is the build from this commit"'
          fi
          # speculation off, for an A/B of what it does to whole makes: the flags out of the rendered config
          if [ "$SPECULATION" = off ]; then
            vm 'echo genesis | sudo -S sh -c "sed -i -E \"s/ --spec-type [^ ]+//\" /etc/genesis/router.yaml && systemctl restart genesis-router"' && echo "speculation OFF for this run"
            vm 'grep -c -- "--spec-type" /etc/genesis/router.yaml || true'
          fi
          # the maker is a user service: an SSH login has a user manager, but nothing started the daemons yet
          vm 'systemctl --user start genesis-permd genesis-agentd; sleep 3; systemctl --user is-active genesis-permd genesis-agentd'
          for i in $(seq 1 60); do vm 'curl -s -m 10 -H "Authorization: Bearer $(cat /etc/genesis/router.key 2>/dev/null)" 127.0.0.1:8080/v1/models' | grep -q '"fast"' && break; sleep 10; done
          vm 'cat > /tmp/eval-makes.py' < prototype/eval-makes.py
          vm "python3 /tmp/eval-makes.py --shard $SHARD --of $OF --out /tmp/results.json --set $SET --timeout $([ "$PACK" = cpu ] && echo 2700 || echo 1500)" 2>eval-progress.log | tee eval-summary.md
          vm 'cat /tmp/results.json' > results.json
          # what the model server said, for a make that timed out or went round in circles
          vm 'echo genesis | sudo -S journalctl -u genesis-router --no-pager -o cat 2>/dev/null | tail -3000' > router.log || true
          # and what the model servers themselves printed, which llama-swap keeps (a crash, a parse failure)
          vm 'curl -s -m 8 -H "Authorization: Bearer $(cat /etc/genesis/router.key 2>/dev/null)" 127.0.0.1:8080/logs/stream/upstream' > upstream.log || true
          # the maker under test itself: a daemon that never answered (a shard lost both makes to it)
          vm 'journalctl --user -u genesis-agentd --no-pager -o short-monotonic 2>/dev/null | tail -300; echo; ls -la $XDG_RUNTIME_DIR/genesis/ 2>&1; cat $XDG_RUNTIME_DIR/genesis/agentd.port 2>&1; id' > agentd.log 2>/dev/null || true
          # a model server that died: its signal and stack, if it left a core
          vm 'echo genesis | sudo -S sh -c "coredumpctl list --no-pager 2>&1 | tail -8; coredumpctl info --no-pager llama-server 2>&1 | head -80"' > coredumps.log 2>/dev/null || true
          vm 'echo genesis | sudo -S systemctl poweroff' >/dev/null 2>&1 || true
          sleep 10; kill $QEMU 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            results.json
            eval-summary.md
            eval-progress.log
            eval-serial.log
            router.log
            upstream.log
            coredumps.log
            agentd.log

  report:
    needs: makes
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: One table out of all the shards
        run: |
          set -o pipefail
          python3 prototype/eval-merge.py shards/*/results.json --out results.json | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          passed=$(python3 -c 'import json; print(json.load(open("results.json"))["passed"])')
          total=$(python3 -c 'import json; print(json.load(open("results.json"))["total"])')
          echo "passed $passed of $total"
          [ "$total" -eq 10 ] || echo "::warning::only $total makes reported: a shard failed before it could write results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-result
          path: |
            results.json
            summary.md
