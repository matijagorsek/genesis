name: eval

# Once a week: ten small makes on the tiny pack (CPU only, the 2B model) inside a fresh VM of the
# latest release, scored. The number moves when the prompts, the tools or the compact script change,
# so a change that helps or hurts small models shows up here rather than in a feeling. Nothing is
# published; the results are an artifact and the job summary.

on:
  schedule:
    - cron: '15 4 * * 0'
  workflow_dispatch:
    inputs:
      only:
        description: 'run only the first N makes (default all ten)'
        default: '10'
      releases_back:
        description: 'which release to test (0 = latest)'
        default: '0'

permissions:
  contents: read

jobs:
  ten-makes:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the release disk
        env:
          GH_TOKEN: ${{ github.token }}
          BACK: ${{ github.event.inputs.releases_back || '0' }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          tag=$(gh release list --repo ${{ github.repository }} --limit 40 --json tagName --jq '[.[]|select(.tagName|test("^v0\\."))]|.['"$BACK"'].tagName')
          echo "testing $tag"; echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo ${{ github.repository }} --pattern 'genesis-*.qcow2.zst.*.part' -D dl
          cat $(ls dl/genesis-*.qcow2.zst.*.part | grep -v arm64 | sort) | zstd -d -o disk.qcow2; rm -rf dl
      - name: KVM and firmware
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf sshpass
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm; sudo chmod 0666 /dev/kvm || true
          qemu-img resize disk.qcow2 +16G
      - name: Boot, install the tiny pack, run ten makes
        env:
          ONLY: ${{ github.event.inputs.only || '10' }}
        run: |
          set -o pipefail
          FW=/usr/share/ovmf/OVMF.fd; [ -f "$FW" ] || FW=/usr/share/OVMF/OVMF.fd
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else ACCEL="-cpu max"; fi
          nohup qemu-system-x86_64 $ACCEL -m 6144 -smp 4 -nographic -bios "$FW" \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
            -serial file:eval-serial.log -display none -monitor none >qemu.out 2>&1 &
          QEMU=$!
          vm() { sshpass -p genesis ssh -p 2222 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR genesis@127.0.0.1 "$@"; }
          for i in $(seq 1 120); do vm true 2>/dev/null && break; kill -0 $QEMU 2>/dev/null || { echo "QEMU exited"; tail -5 qemu.out; exit 1; }; sleep 10; done
          vm 'grep --color=never ^IMAGE_VERSION= /etc/os-release'
          # the first-run wizard answers once its service is up; then the tiny pack through its own API
          # (the model files come from GHCR or Hugging Face)
          for i in $(seq 1 60); do vm 'curl -s -m 10 127.0.0.1:11510/api/state' | grep -q '"packs"' && break; sleep 5; done
          vm 'curl -s -m 10 127.0.0.1:11510/api/state | head -c 400; echo'
          vm 'T=$(echo genesis | sudo -S cat /run/genesis/firstrun.token 2>/dev/null); echo "token: ${#T} chars"; curl -s -m 20 -H "X-Genesis-Token: $T" -H "Content-Type: application/json" -d "{\"pack\":\"tiny\",\"force\":true}" 127.0.0.1:11510/api/choose; echo'
          for i in $(seq 1 240); do
            st=$(vm 'curl -s -m 10 127.0.0.1:11510/api/state' | python3 -c 'import sys,json; p=json.load(sys.stdin).get("progress",{}); print(p.get("state",""), p.get("error","") or "", {k:v for k,v in p.items() if "byte" in k or "file" in k})' 2>/dev/null || echo "?")
            echo "  $st"
            case "$st" in done*) break;; error*) echo "download failed"; break;; *) sleep 15;; esac
          done
          # the maker is a user service: an SSH login has a user manager, but nothing started the daemons yet
          vm 'systemctl --user start genesis-permd genesis-agentd; sleep 3; systemctl --user is-active genesis-permd genesis-agentd; echo genesis | sudo -S systemctl status genesis-router --no-pager 2>&1 | head -3'
          for i in $(seq 1 60); do vm 'curl -s -m 10 127.0.0.1:8080/v1/models' | grep -q '"fast"' && break; sleep 10; done
          vm 'curl -s -m 10 127.0.0.1:8080/v1/models | head -c 300; echo'
          vm 'cat > /tmp/eval-makes.py' < prototype/eval-makes.py
          vm "python3 /tmp/eval-makes.py --only $ONLY --out /tmp/results.json --timeout 900" 2>eval-progress.log | tee eval-summary.md
          vm 'cat /tmp/results.json' > results.json
          vm 'echo genesis | sudo -S systemctl poweroff' >/dev/null 2>&1 || true
          sleep 10; kill $QEMU 2>/dev/null || true
          { echo "Release: $TAG"; echo; cat eval-summary.md; } >> "$GITHUB_STEP_SUMMARY"
          passed=$(python3 -c 'import json; d=json.load(open("results.json")); print(d["passed"])')
          echo "passed $passed of $(python3 -c 'import json; print(json.load(open("results.json"))["total"])')"
          [ "$passed" -ge 1 ] || { echo "::warning::no make passed: look at the progress log"; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ env.TAG }}
          path: |
            results.json
            eval-summary.md
            eval-progress.log
            eval-serial.log
