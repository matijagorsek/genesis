name: canary

# Every night, and this is what moves the stable channel: does a machine installed a while ago still update cleanly to today's image, and does
# today's image still tell the first-run story? Takes a release from about a week back, boots it under
# KVM, switches it to the stable channel, reboots, and checks what came up. Nothing is published; the
# serial logs are attached as artifacts. A red canary means "look before the next release", not a
# broken release.

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      releases_back:
        description: 'how many releases back to start from'
        default: '5'
      promote:
        description: 'true = move the stable tags to testing when this run is green'
        default: 'false'

# One canary at a time, and they queue rather than cancel: a run that is part-way through promoting
# should finish that, not be interrupted. A scheduled run and one started by hand can otherwise overlap,
# boot two virtual machines at once and both write the stable tag.
concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  packages: write

jobs:
  upgrade-from-old:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/genesis
    steps:
      - uses: actions/checkout@v4
      - name: Pick a release from about a week back and fetch its disk
        env:
          GH_TOKEN: ${{ github.token }}
          BACK: ${{ github.event.inputs.releases_back || '5' }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          tag=$(gh release list --repo ${{ github.repository }} --limit 40 --json tagName,publishedAt --jq '[.[]|select(.tagName|test("^v0\\."))]|.['"$BACK"'].tagName')
          echo "starting from $tag (today: $(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName'))"
          echo "OLD_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo ${{ github.repository }} --pattern 'genesis-*.qcow2.zst.*.part' --pattern 'SHA256SUMS.qcow2' -D old
          cd old; ls; sha256sum -c SHA256SUMS.qcow2 2>/dev/null | grep -v arm64 || true
          cat $(ls genesis-*.qcow2.zst.*.part | grep -v arm64 | sort) | zstd -d -o ../old.qcow2
          cd ..; rm -rf old; qemu-img info old.qcow2 | head -3 || true
      - name: KVM and firmware
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf sshpass skopeo podman
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm; sudo chmod 0666 /dev/kvm || true
          qemu-img resize old.qcow2 +16G
      - name: Boot the old release, switch to the testing channel, reboot, check
        run: |
          set -o pipefail
          FW=/usr/share/ovmf/OVMF.fd; [ -f "$FW" ] || FW=/usr/share/OVMF/OVMF.fd
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else ACCEL="-cpu max"; fi
          # An install that already follows :stable answers "unchanged" to the switch, so the upgrade is
          # asked for explicitly afterwards; a machine on a versioned tag gets both.
          # The guest is driven over SSH on a forwarded port, not by typing at the serial console: the
          # getty handshake proved racy (prompt flushes, delayed echo), and SSH is what a person would use.
          # The serial console still goes to a file and is attached as the artifact.
          nohup qemu-system-x86_64 $ACCEL -m 4096 -smp 2 -nographic -bios "$FW" \
            -drive file=old.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
            -serial file:canary-serial.log -display none -monitor none >qemu.out 2>&1 &
          QEMU=$!
          vm() { sshpass -p genesis ssh -p 2222 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR genesis@127.0.0.1 "$@"; }
          wait_ssh() { # up to 20 minutes for the guest to answer
            for i in $(seq 1 120); do vm true 2>/dev/null && return 0; kill -0 $QEMU 2>/dev/null || { echo "QEMU exited"; tail -5 qemu.out; return 1; }; sleep 10; done
            echo "TIMEOUT: no SSH from the guest"; return 1
          }
          wait_ssh || exit 1
          before=$(vm 'grep --color=never ^IMAGE_VERSION= /etc/os-release'); echo "before: $before"
          timeout 1500 sshpass -p genesis ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR genesis@127.0.0.1 \
            'echo genesis | sudo -S bootc switch ghcr.io/matijagorsek/genesis:testing 2>&1 | tail -3; sudo bootc upgrade 2>&1 | tail -5' || { echo "the switch did not finish"; exit 1; }
          # Which image this test is about. Asked of the registry, not of the machine: what bootc reports
          # as the booted digest is not a manifest the registry will serve (it 404s), so the first attempt
          # at this fell back to the tag every time while looking like it had worked. The tag is resolved
          # here, seconds before the machine pulls it, and that digest is what becomes stable — so a build
          # landing during the test cannot put an untested image on the channel every machine follows.
          tested=$(sudo skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/matijagorsek/genesis:testing" 2>/dev/null || true)
          echo "this test is about $tested"; echo "TESTED_DIGEST=$tested" >> "$GITHUB_ENV" 
          vm 'echo genesis | sudo -S systemctl reboot' || true
          sleep 30; wait_ssh || exit 1
          after=$(vm 'grep --color=never ^IMAGE_VERSION= /etc/os-release'); echo "after: $after"
          vm 'echo genesis | sudo -S genesis-image-check 2>&1' > check.txt || true
          echo "--- self-check after the upgrade:"; cat check.txt
          echo "--- disk after the upgrade (the root should have grown into the resized disk):"; vm 'df -h / /var 2>/dev/null; lsblk -o NAME,SIZE,MOUNTPOINTS 2>/dev/null | head -8; echo genesis | sudo -S journalctl -b -1 -u genesis-growpart -u bootc-generic-growpart --no-pager 2>/dev/null | tail -6; echo "--- this boot:"; sudo journalctl -b -u genesis-growpart -u bootc-generic-growpart --no-pager 2>/dev/null | tail -6' || true
          ok=$(grep -c "^  ok" check.txt || echo 0)
          fails=$(grep FAIL check.txt || true)
          # The wizard starts after the network is up and the hardware probe has run, so asking it once the
          # moment a machine finishes rebooting is a race — and losing that race held the stable tag for a
          # day while the upgrade itself had worked perfectly. Wait for it, and if it never answers, say
          # why before the machine is powered off: a canary that only reports "silent" cannot be acted on.
          wizard=""
          for i in $(seq 1 18); do
            wizard=$(vm 'curl -s -m 10 127.0.0.1:11510/api/state | grep --color=never -o recommended_pack | head -1' 2>/dev/null || true)
            [ -n "$wizard" ] && { echo "the wizard answered after $(( i * 5 ))s"; break; }
            sleep 5
          done
          if [ -z "$wizard" ]; then
            echo "--- the wizard never answered; what the machine says about it:"
            vm 'systemctl is-active genesis-firstrun genesis-probe 2>&1 | paste -sd" " -; echo genesis | sudo -S systemctl status genesis-firstrun --no-pager 2>/dev/null | head -12; echo "--- its log:"; echo genesis | sudo -S journalctl -u genesis-firstrun --no-pager -n 25 2>/dev/null; echo "--- is first run already done (the wizard does not run then):"; ls -l /var/lib/genesis/first-run-done 2>&1 | head -1; echo "--- listening:"; ss -ltn 2>/dev/null | grep 11510 || echo "nothing on 11510"' || true
          fi
          # Can this machine actually answer? Every check above passes on a machine whose assistant cannot
          # load a single model: an image once reached the stable channel where the configured server
          # command could not start at all, and the canary was green the whole time, because booting,
          # answering the wizard and running the self-check never ask a model to load.
          #
          # Two tiers, because a canary machine has usually not been through first run and so has no model
          # on disk. The first tier always runs and is the one that catches the break above: take the
          # server command the router is configured to use -- or the default one when there is no config
          # yet -- and start it. A command that cannot start says so here.
          answer=""
          echo "--- can the assistant load a model?"
          serverbin=$(vm 'sed -n "s/^ *server: *\"\([^ ]*\).*/\1/p" /etc/genesis/router.yaml 2>/dev/null | head -1' 2>/dev/null || true)
          [ -n "$serverbin" ] || serverbin=genesis-llama-server
          echo "the configured server command is: $serverbin"
          startup=$(vm "command -v $serverbin >/dev/null 2>&1 || { echo 'NOT-INSTALLED'; exit 0; }; $serverbin --version 2>&1 | tail -3" 2>/dev/null || true)
          echo "$startup"
          case "$startup" in
            *"error while loading shared libraries"*|*"No such file or directory"*|*NOT-INSTALLED*|"")
              echo "STARTUP-BROKEN" ;;
            *) startup=ok ;;
          esac
          # The second tier used to run only when a model happened to be on disk, and no canary machine ever
          # had one: they start from a release disk that has not been through first run. So the canary goes
          # through first run itself, the way a person does -- the wizard's own API, the smallest pack, the
          # small model first -- and then asks. A few gigabytes a night is what it costs to promise that every
          # image on the stable channel is one that answered a question.
          echo "--- first run: choosing the tiny pack through the wizard"
          chosen=$(vm 'tok=$(echo genesis | sudo -S cat /run/genesis/firstrun.token 2>/dev/null); curl -s -m 30 -X POST -H "X-Genesis-Token: $tok" -H "Content-Type: application/json" -d "{\"pack\":\"tiny\",\"force\":true}" 127.0.0.1:11510/api/choose' 2>/dev/null || true)
          echo "the wizard said: ${chosen:0:200}"
          for i in $(seq 1 90); do
            st=$(vm 'curl -s -m 10 127.0.0.1:11510/api/state' 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); p=d.get("progress",{}); print(p.get("state",""), p.get("percent", p.get("pct","")), sep=" ")' 2>/dev/null || echo "?")
            case "$st" in done*|idle*) [ "$i" -gt 1 ] && break ;; esac
            if vm 'ls /var/lib/genesis/models/fast/*.gguf >/dev/null 2>&1' && [ "$i" -gt 6 ]; then break; fi
            [ $((i % 6)) -eq 0 ] && echo "  $(( i * 10 ))s: $st"
            sleep 10
          done
          echo "first run: $st after $(( i * 10 ))s; models on disk: $(vm 'ls /var/lib/genesis/models/ 2>/dev/null | tr "\n" " "')"
          # The second tier: with a model on disk it is the real thing -- ask the router the same question a
          # person would and require words back. Without one it is a failure now, not a skip.
          if vm 'ls /var/lib/genesis/models/*/*.gguf >/dev/null 2>&1'; then
            for i in $(seq 1 24); do
              answer=$(vm 'curl -s -m 120 -H "Authorization: Bearer $(cat /etc/genesis/router.key 2>/dev/null)" -H "Content-Type: application/json" -d "{\"model\":\"fast\",\"messages\":[{\"role\":\"user\",\"content\":\"Say hello.\"}],\"max_tokens\":16}" 127.0.0.1:8080/v1/chat/completions' 2>/dev/null || true)
              case "$answer" in *'"content"'*) echo "the assistant answered after $(( i * 10 ))s"; break ;; esac
              answer=""; sleep 10
            done
            [ -n "$answer" ] || { echo "--- it did not answer; what the machine says:"; vm 'echo genesis | sudo -S journalctl -u genesis-router --no-pager -n 30 2>/dev/null' || true; }
          else
            echo "no model on disk after first run: the download did not happen or did not finish"
            vm 'echo genesis | sudo -S journalctl -u genesis-firstrun --no-pager -n 30 2>/dev/null' || true
            answer=""
          fi
          vm 'echo genesis | sudo -S systemctl poweroff' >/dev/null 2>&1 || true
          sleep 10; kill $QEMU 2>/dev/null || true
          echo "self-check: $ok ok; failures: ${fails:-none}; wizard: ${wizard:-silent}; server command: ${startup:-unknown}"
          [ -n "$after" ] || { echo "no version after the upgrade"; exit 1; }
          [ "$before" != "$after" ] || { echo "the version did not change: the upgrade did not take"; exit 1; }
          [ -n "$wizard" ] || { echo "the wizard API did not answer after the upgrade"; exit 1; }
          [ "$startup" = ok ] || { echo "the configured server command cannot start: no model can load on this image"; exit 1; }
          [ -n "$answer" ] || { echo "the assistant never answered: no image reaches stable without answering a question"; exit 1; }
          if [ -n "$fails" ]; then echo "::warning::self-check reported a failure after the upgrade: $fails"; fi
          echo "canary: $before -> $after, wizard answers, self-check ran, the server command starts${answer:+, assistant: $answer}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-serial
          path: canary-serial.log
      # A red canary holds the stable tag (see build-image.yml), and used to tell nobody. Now it opens an
      # issue, or adds to the open one; a green canary closes it.
      # Promotion: the machine that upgraded to :testing came up, went through first run, and the assistant answered.
      # The same digest becomes :stable for every flavour (the arm64 and NVIDIA images are the same commit
      # and not canary-tested: the x86 image is the proxy). Retagging keeps the cosign signature valid,
      # because it is attached to the digest.
      - name: Promote testing to stable
        if: success() && (github.event_name == 'schedule' || github.event.inputs.promote == 'true')
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for suffix in "" -arm64 -nvidia; do
            # the x86 image by the digest that was actually booted and checked; the other flavours by tag,
            # since they are built from the same commit and cannot be canary-tested here
            src="docker://ghcr.io/${{ github.repository }}:testing$suffix"
            # What bootc reports as the booted digest is not always something the registry will serve back
            # (it answered "manifest unknown" the first time this was tried), so ask before relying on it
            # and fall back to the tag when it cannot be resolved. Promoting nothing at all is the one
            # outcome that must not happen quietly.
            if [ -z "$suffix" ] && [ -n "${TESTED_DIGEST:-}" ]; then
              cand="docker://ghcr.io/${{ github.repository }}@${TESTED_DIGEST}"
              if sudo skopeo inspect --raw "$cand" >/dev/null 2>&1; then src="$cand"
              else echo "::warning::the digest the machine reported (${TESTED_DIGEST}) is not in the registry; promoting the testing tag instead"; fi
            fi
            # no && here: a copy that fails must fail this step, not print nothing and let the run go green
            sudo skopeo copy --all "$src" "docker://ghcr.io/${{ github.repository }}:stable$suffix"
            echo "stable$suffix now = $src"
          done
      - name: Tell someone when the canary is red
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --repo ${{ github.repository }} --state open --search "canary is red in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --repo ${{ github.repository }} --body "Still red: $url"
          else gh issue create --repo ${{ github.repository }} --title "The canary is red: the stable tag is held" --body "The nightly upgrade canary failed, so builds publish versioned tags only and installed machines stop getting updates until it is green again. Run: $url"; fi
      - name: Close the alert when the canary is green again
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo ${{ github.repository }} --state open --search "canary is red in:title" --json number --jq '.[0].number // empty')
          [ -z "$n" ] || gh issue close "$n" --repo ${{ github.repository }} --comment "Green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
