name: bump-base

# The base images are pinned by digest so a build is reproducible and nobody can swap what "stable"
# points at underneath us. Upstream registries garbage-collect untagged manifests (quay.io dropped a
# fedora-bootc digest within a day), so the pins point at OUR mirror of each base, which never loses a
# digest: ghcr.io/<owner>/genesis-base:<name>. This job copies the current upstream images into the
# mirror and moves the pins forward, once a week, as a commit the normal build then verifies.

on:
  schedule:
    - cron: '30 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  MIRROR: ghcr.io/${{ github.repository_owner }}/genesis-base

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the upstream bases and resolve the mirror digests
        id: dig
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || sudo apt-get install -y -q skopeo >/dev/null
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u ${{ github.actor }} --password-stdin
          mirror() { # name, source
            skopeo copy --all --retry-times 5 "docker://$2" "docker://$MIRROR:$1" >/dev/null
            skopeo inspect --raw "docker://$MIRROR:$1" | sha256sum | cut -d' ' -f1
          }
          echo "aurora=$(mirror aurora-stable ghcr.io/ublue-os/aurora:stable)" >> "$GITHUB_OUTPUT"
          echo "nvidia=$(mirror aurora-nvidia-open-stable ghcr.io/ublue-os/aurora-nvidia-open:stable)" >> "$GITHUB_OUTPUT"
          echo "fedora=$(mirror fedora-bootc-44 quay.io/fedora/fedora-bootc:44)" >> "$GITHUB_OUTPUT"
          echo "bib=$(mirror bootc-image-builder quay.io/centos-bootc/bootc-image-builder:latest)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Rewrite the pins to the mirror
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          M = os.environ["MIRROR"]
          pins = [
            (r"ghcr\.io/ublue-os/aurora:stable(@sha256:[0-9a-f]{64})?", f"{M}:aurora-stable@sha256:{os.environ['AURORA']}"),
            (r"ghcr\.io/ublue-os/aurora-nvidia-open:stable(@sha256:[0-9a-f]{64})?", f"{M}:aurora-nvidia-open-stable@sha256:{os.environ['NVIDIA']}"),
            (r"quay\.io/fedora/fedora-bootc:44(@sha256:[0-9a-f]{64})?", f"{M}:fedora-bootc-44@sha256:{os.environ['FEDORA']}"),
            (r"quay\.io/centos-bootc/bootc-image-builder:latest(@sha256:[0-9a-f]{64})?", f"{M}:bootc-image-builder@sha256:{os.environ['BIB']}"),
            (re.escape(M) + r":aurora-stable@sha256:[0-9a-f]{64}", f"{M}:aurora-stable@sha256:{os.environ['AURORA']}"),
            (re.escape(M) + r":aurora-nvidia-open-stable@sha256:[0-9a-f]{64}", f"{M}:aurora-nvidia-open-stable@sha256:{os.environ['NVIDIA']}"),
            (re.escape(M) + r":fedora-bootc-44@sha256:[0-9a-f]{64}", f"{M}:fedora-bootc-44@sha256:{os.environ['FEDORA']}"),
            (re.escape(M) + r":bootc-image-builder@sha256:[0-9a-f]{64}", f"{M}:bootc-image-builder@sha256:{os.environ['BIB']}"),
          ]
          for path in ["Containerfile", ".github/workflows/build-image.yml"]:
              s = open(path).read()
              for pat, rep in pins:
                  s = re.sub(pat, rep, s)
              open(path, "w").write(s)
          PY
          grep -n "genesis-base" Containerfile .github/workflows/build-image.yml | head -12
        env:
          AURORA: ${{ steps.dig.outputs.aurora }}
          NVIDIA: ${{ steps.dig.outputs.nvidia }}
          FEDORA: ${{ steps.dig.outputs.fedora }}
          BIB: ${{ steps.dig.outputs.bib }}
      - name: Commit if anything moved
        run: |
          git config user.name "genesis-bot"
          git config user.email "genesis-bot@users.noreply.github.com"
          git add Containerfile .github/workflows/build-image.yml
          git diff --cached --quiet && { echo "pins unchanged"; exit 0; }
          git commit -m "base: move the pinned digests forward (mirrored under genesis-base)"
          git push
