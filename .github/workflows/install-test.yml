name: install-test

# The only complete test of the installer medium: install the released ISO onto a blank disk, unattended,
# then boot what was installed with no network and ask the assistant a question. Booting the ISO and
# photographing the installer (the ISO job) proves the installer starts; this proves it installs, that
# the kickstart's %post put the model pack on the disk, and that a freshly installed machine answers
# offline. Runs after every image build, and by hand against any release.

on:
  workflow_run:
    workflows: [build-image]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'release to test (default: the newest with an ISO)'
        default: ''
      discover:
        description: 'true = only print the ISO boot config and embedded kickstart'
        default: 'false'

concurrency:
  group: install-test
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools, KVM, room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf xorriso socat imagemagick sshpass >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm; sudo chmod 0666 /dev/kvm || true
          [ -w /dev/kvm ] && echo "kvm: yes" || { echo "::error::no KVM: an install under emulation would not finish"; exit 1; }
          df -h / | tail -1

      - name: The ISO
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG_IN"
          if [ -z "$tag" ]; then
            for t in $(gh release list --repo ${{ github.repository }} --limit 10 --json tagName --jq '.[].tagName'); do
              n=$(gh release view "$t" --repo ${{ github.repository }} --json assets --jq '[.assets[]|select(.name|test("\\.iso\\."))]|length')
              [ "$n" -gt 0 ] && { tag=$t; break; }
            done
          fi
          echo "testing $tag"; echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p iso && cd iso
          gh release download "$tag" --repo ${{ github.repository }} --pattern '*.iso.*.part' --pattern 'SHA256SUMS.iso'
          cat $(ls *.iso.*.part | sort) > genesis.iso && rm -f *.part
          want=$(grep -vE '\.part$' SHA256SUMS.iso | head -1 | cut -d' ' -f1); got=$(sha256sum genesis.iso | cut -d' ' -f1)
          [ "$want" = "$got" ] && echo "checksum ok" || { echo "::error::the joined ISO does not match its checksum"; exit 1; }
          ls -la genesis.iso

      - name: Boot config and embedded kickstart
        run: |
          set -uo pipefail
          cd iso
          echo "--- volume id: $(xorriso -indev genesis.iso -pvd_info 2>/dev/null | grep -i 'Volume Id' | cut -d: -f2- | xargs)"
          xorriso -osirrox on -indev genesis.iso -extract /EFI/BOOT/grub.cfg grub.cfg -extract /images/pxeboot/vmlinuz vmlinuz -extract /images/pxeboot/initrd.img initrd.img >/dev/null 2>&1 || true
          echo "--- grub.cfg (menu entries):"; grep -E "menuentry|linux|initrd|search" grub.cfg | head -12
          echo "--- files at the top of the ISO:"; xorriso -indev genesis.iso -find / -maxdepth 1 -- 2>/dev/null | head -20
          for k in /osbuild.ks /osbuild-base.ks /ks.cfg; do
            if xorriso -osirrox on -indev genesis.iso -extract "$k" embedded.ks >/dev/null 2>&1; then echo "--- embedded kickstart $k:"; cat embedded.ks; echo "EMBEDDED_KS=$k" >> "$GITHUB_ENV"; break; fi
          done
          ls -la vmlinuz initrd.img 2>/dev/null
