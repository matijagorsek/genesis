name: build-image

on:
  push:
    branches: [main]
    paths: [Containerfile, system_files/**, iso/**, .github/workflows/build-image.yml]
  pull_request:
    paths: [Containerfile, system_files/**, iso/**]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # nightly: inherit Fedora/Aurora updates

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/genesis

jobs:
  image:
    runs-on: ubuntu-24.04     # native x86_64: bootc lint runs strict here
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Free runner disk (image + qcow2 + ISO need ~25 GB)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/lib/jvm \
                      /usr/local/julia* /opt/microsoft /usr/share/miniconda /usr/local/share/chromium /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / | tail -1

      - name: Pull base image (retry on GHCR blob timeouts)
        run: |
          for i in 1 2 3 4 5 6; do
            sudo podman pull ghcr.io/ublue-os/aurora:stable && break
            echo "pull attempt $i failed, waiting"; sleep 30
          done
          sudo podman image exists ghcr.io/ublue-os/aurora:stable

      - name: Build image
        run: |
          sudo podman build -f Containerfile --pull=never \
            --build-arg BOOTC_LINT=strict \
            --build-arg GENESIS_VERSION=${{ steps.meta.outputs.tag }} \
            -t $IMAGE:0.1 -t $IMAGE:${{ steps.meta.outputs.tag }} .

      - name: Image self-check
        run: sudo podman run --rm $IMAGE:0.1 genesis-image-check

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          sudo podman push $IMAGE:0.1
          sudo podman push $IMAGE:${{ steps.meta.outputs.tag }}

      # ---- disk images (bootc-image-builder needs root podman + loop devices) ----
      - name: Build qcow2
        run: |
          mkdir -p out
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/out:/output" -v "$PWD/iso/config.toml:/config.toml:ro" \
            -v "$PWD/iso/defs/genesis-44.yaml:/usr/share/bootc-image-builder/defs/genesis-44.yaml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs --config /config.toml --local $IMAGE:0.1
          sudo chown -R "$USER" out; ls -la out/qcow2; df -h / | tail -1

      # ---- boot test: QEMU/KVM, serial console, wait for login prompt, then check via serial ----
      - name: Boot test (qcow2)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf expect
          # GitHub runners expose /dev/kvm but only root may open it; grant access (documented workaround)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm || true
          ls -la /dev/kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else echo "no KVM, using TCG"; ACCEL="-cpu max"; fi
          cp out/qcow2/disk.qcow2 boot.qcow2
          timeout 900 expect -c '
            set timeout 840
            spawn qemu-system-x86_64 '"$ACCEL"' -m 4096 -smp 2 -nographic \
              -bios /usr/share/ovmf/OVMF.fd \
              -drive file=boot.qcow2,if=virtio,format=qcow2 \
              -serial mon:stdio -display none
            expect {
              -re "login:" { send "genesis\r" }
              timeout { puts "TIMEOUT waiting for login"; exit 1 }
            }
            expect "Password:" { send "genesis\r" }
            expect -re "\\$ " { send "cat /etc/os-release | head -3; systemctl is-enabled genesis-router.socket; systemctl is-active genesis-router.socket; genesis-image-check | tail -3; echo BOOTTEST-DONE\r" }
            expect {
              "BOOTTEST-DONE" { puts "\nboot test reached shell"; }
              timeout { puts "TIMEOUT in shell"; exit 1 }
            }
            send "sudo poweroff\r"
            expect eof
          ' | tee boot-serial.log
          grep -q 'ID=genesis' boot-serial.log
          grep -q 'enabled' boot-serial.log

      - name: Build installer ISO
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/out:/output" -v "$PWD/iso/config.toml:/config.toml:ro" \
            -v "$PWD/iso/defs/genesis-44.yaml:/usr/share/bootc-image-builder/defs/genesis-44.yaml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --config /config.toml --local $IMAGE:0.1
          sudo chown -R "$USER" out; ls -la out/bootiso

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genesis-${{ steps.meta.outputs.tag }}
          path: |
            out/qcow2/disk.qcow2
            out/bootiso/*.iso
            boot-serial.log
          retention-days: 14
          compression-level: 0

      - name: Release (main only)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.tag }}
          name: Genesis ${{ steps.meta.outputs.tag }}
          prerelease: true
          files: |
            out/bootiso/*.iso
            out/qcow2/disk.qcow2
            boot-serial.log
