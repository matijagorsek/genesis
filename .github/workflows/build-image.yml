name: build-image

on:
  push:
    branches: [main]
    paths: [Containerfile, system_files/**, iso/**, src/**, .github/workflows/build-image.yml]
  pull_request:
    paths: [Containerfile, system_files/**, iso/**, src/**]
  workflow_dispatch:
    inputs:
      ignore_canary:
        description: 'move the stable tags even if the last weekly canary was red'
        default: 'false'

# One build of a branch at a time, and a newer commit cancels an older one still running.
#
# Without this, two builds race to push :testing and whichever finishes last wins — which is not the same
# as whichever is newest. On 20 Sep five builds ran at once: 0.2.233 pushed at 09:49 and 0.2.232, from an
# older commit, pushed over it at 09:57. The canary then promotes :testing to stable, so a fix could be
# published and silently un-published by an older build finishing after it. The version number is taken
# from the run number, which says when a build started and nothing about when it ended.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
  COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/genesis
  
jobs:
  # ---------------------------------------------------------------------------------------
  # Job 0: Rust daemons unit tests (fast, native)
  # ---------------------------------------------------------------------------------------
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Base image pins
        run: |
          grep -E "^[A-Z]+_REF=" .github/base-pins.env >> "$GITHUB_ENV"; echo "BIB=$(grep ^BIB_REF= .github/base-pins.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          # the mirror lives on GHCR: log in before the first pull (a private package needs it, a public one does not mind)
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@stable
      - name: No credentials in the tree
        run: |
          if grep -r -n -E 'sk-ant-[A-Za-z0-9_-]{8,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' --exclude-dir=.git . ; then
            echo "a credential-like string is committed"; exit 1; fi
      - name: Test
        run: cd src && cargo test --release --locked
      - name: Known vulnerabilities in the Rust dependency graph (RustSec)
        run: |
          cargo install cargo-audit --locked --quiet 2>/dev/null || true
          cd src && cargo audit --deny warnings || echo "::warning::cargo audit reported advisories; see the log"
      - name: Scripts and pages parse (shell, Python, the JavaScript inside the HTML pages)
        run: |
          set -e
          export PYTHONDONTWRITEBYTECODE=1 PYTHONPYCACHEPREFIX=/tmp/pyc
          for f in system_files/usr/bin/*; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              *python*) python3 -m py_compile "$f" ;;
              *bash*|*/sh*) bash -n "$f" ;;
            esac
          done
          python3 -m py_compile prototype/eval-makes.py
          python3 -c "import yaml,glob,sys; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]" || { echo "::error::a workflow file does not parse"; exit 1; }
          for js in src/genesis-agentd/ui/*.js; do node --check "$js" || { echo "::error::$js does not parse"; exit 1; }; done
          node tests/js/pages.test.js || { echo "::error::the page scripts failed their tests"; exit 1; }
          python3 -c 'import re,sys; print("\n".join(re.findall(r"<script>([\s\S]*?)</script>", open("src/genesis-firstrun/ui/index.html").read())))' > /tmp/page.js
          node --check /tmp/page.js || { echo "::error::the wizard JavaScript does not parse"; exit 1; }
          for page in src/genesis-agentd/ui/*.html; do grep -q "__GENESIS_JS__" "$page" || { echo "::error::$page lost its script placeholder"; exit 1; }; done
          node --check system_files/usr/share/genesis/babel/extension/extension.js
          for j in apps/*/static/*.js; do node --check "$j"; done
          for p in apps/*/app.py; do python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$p"; done
          # Every shell script in the image, checked. Five of the faults found on the first real machine
          # were shell code where a decision rested on whether a command had run rather than on what it
          # said — an `ls` on an empty directory read as success, a `curl` against a 503 read as ready,
          # a `skopeo copy` behind an `&&` that failed in silence. shellcheck does not catch all of that
          # shape, but it catches enough of it, and it costs nothing to have it watching from now on.
          # A pinned shellcheck, because the one in apt is older than the one a person has locally and
          # flags things the newer one does not: a check that passes on your machine and fails here is
          # worse than no check. The version is printed so a disagreement is visible rather than puzzling.
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C /tmp
          SC=/tmp/shellcheck-v0.11.0/shellcheck
          $SC --version | grep version:
          mapfile -t scripts < <(find system_files -type f -exec sh -c 'head -1 "$1" | grep -qE "^#!.*(bash|sh)" && echo "$1"' _ {} \;)
          [ "${#scripts[@]}" -ge 10 ] || { echo "::error::only ${#scripts[@]} shell scripts found; the search is broken, not the repository"; exit 1; }
          echo "checking ${#scripts[@]} shell scripts"
          $SC -S warning "${scripts[@]}" || { echo "::error::shellcheck found something worth fixing in a shipped script"; exit 1; }
          for j in packs/*.json templates/*/genesis.json apps/*/genesis.json system_files/usr/share/genesis/*.json system_files/usr/share/genesis/mcp/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$j"; done
          # Every model a pack names must still exist. The CPU pack carried a repo that had become a 401,
          # and nothing noticed until someone chose that pack on a real machine and the whole download
          # failed on the first call. One HEAD per repo, deduplicated.
          python3 - <<'PYCHECK'
          import glob, json, sys, urllib.request
          repos = {}
          for f in sorted(glob.glob("packs/*.json")):
              if f.endswith("schema.json"):
                  continue
              d = json.load(open(f))
              for m in d["models"]:
                  repos.setdefault(m["repo"], []).append(f"{d['id']}/{m['role']}")
          dead = []
          for repo, used in sorted(repos.items()):
              url = f"https://huggingface.co/api/models/{repo}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      code = r.status
              except urllib.error.HTTPError as e:
                  code = e.code
              except Exception as e:
                  print(f"  ?? {repo}: {e}")
                  continue
              print(f"  {code} {repo}")
              if code != 200:
                  dead.append(f"{repo} ({code}), named by {', '.join(used)}")
          for d in dead:
              print(f"::error::a pack names a model that cannot be fetched: {d}")
          sys.exit(1 if dead else 0)
          PYCHECK

      - name: Python tool tests (index, Ollama shim, system server)
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/python

      - name: Policy file is in sync with the binary
        run: |
          cd src && cargo run -q --release -p genesis-permd -- --audit /tmp/a.jsonl policy dump > /tmp/policy.toml
          diff -u ../system_files/usr/share/genesis/policy.d/00-default.toml /tmp/policy.toml

  # ---------------------------------------------------------------------------------------
  # Job 1: OCI image (strict lint) -> push -> qcow2 -> QEMU boot test -> release (split parts)
  # ---------------------------------------------------------------------------------------
  image:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      stable_ok: ${{ steps.meta.outputs.stable_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the last hundred commits go into the image, so an installed machine can say what changed
          # between the image it runs and the one it has staged (genesis-upgrade-notes)
          fetch-depth: 120
      - name: What changed, for the machine that installs this
        run: |
          git log --no-merges --format='%h %s' -n 100 | grep -v '\[skip ci\]' > system_files/usr/share/genesis/changes.txt
          echo "$(wc -l < system_files/usr/share/genesis/changes.txt) change lines go into the image; newest: $(head -1 system_files/usr/share/genesis/changes.txt)"
      - name: Base image pins
        run: |
          grep -E "^[A-Z]+_REF=" .github/base-pins.env >> "$GITHUB_ENV"; echo "BIB=$(grep ^BIB_REF= .github/base-pins.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          # the mirror lives on GHCR: log in before the first pull (a private package needs it, a public one does not mind)
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null 2>&1 || true

      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Channels: every build pushes :testing (and the versioned tag). :stable, which installed machines
          # follow, moves only when the nightly canary has upgraded a machine to :testing and found it good
          # (canary.yml promotes). A push to main therefore never reaches anyone's machine unseen.
          echo "stable_ok=false" >> "$GITHUB_OUTPUT"

      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/lib/jvm \
                      /usr/local/julia* /opt/microsoft /usr/share/miniconda /usr/local/share/chromium /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / | tail -1

      - name: Pull base image (retry on GHCR blob timeouts)
        run: |
          for i in 1 2 3 4 5 6; do
            sudo podman pull ${AURORA_REF} && break
            echo "pull attempt $i failed, waiting"; sleep 30
          done
          sudo podman image exists "$(echo "${AURORA_REF}" | sed "s/:[a-z0-9-]*@/@/")"
          for i in 1 2 3 4 5 6; do
            sudo podman pull docker.io/library/rust:1-bookworm && break
            echo "rust pull attempt $i failed, waiting"; sleep 30
          done
          sudo podman image exists docker.io/library/rust:1-bookworm
          for i in 1 2 3 4 5 6; do
            sudo podman pull quay.io/fedora/fedora:44 && break
            echo "fedora pull attempt $i failed, waiting"; sleep 30
          done
          sudo podman image exists quay.io/fedora/fedora:44

      - name: Login to GHCR (build cache)
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # Layer cache in GHCR: unchanged stages (Rust cross-compile, Qt window, whisper.cpp, package
      # installs) are pulled instead of rebuilt, so a typical push rebuilds only what changed.
      - name: Build image
        run: |
          # First try with the registry cache (read and write). Pushing cache blobs to GHCR sometimes
          # fails transiently and aborts podman; the fallback rebuilds from the local layer cache without
          # writing the remote cache, which is fast because every layer is already local.
          sudo podman build -f Containerfile --pull=never --layers \
            --cache-from $IMAGE-cache --cache-to $IMAGE-cache --cache-ttl 168h \
            --build-arg BOOTC_LINT=strict \
            --build-arg GENESIS_VERSION=${{ steps.meta.outputs.tag }} \
            -t $IMAGE:stable -t $IMAGE:0.1 -t $IMAGE:${{ steps.meta.outputs.tag }} . \
          || sudo podman build -f Containerfile --pull=never --layers \
            --cache-from $IMAGE-cache \
            --build-arg BOOTC_LINT=strict \
            --build-arg GENESIS_VERSION=${{ steps.meta.outputs.tag }} \
            -t $IMAGE:stable -t $IMAGE:0.1 -t $IMAGE:${{ steps.meta.outputs.tag }} .

      - name: Image self-check
        run: sudo podman run --rm $IMAGE:stable genesis-image-check

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          sudo podman tag $IMAGE:stable $IMAGE:testing && sudo podman push $IMAGE:testing
          sudo podman push $IMAGE:0.1
          sudo podman push $IMAGE:${{ steps.meta.outputs.tag }}

      - name: Sign the image (sigstore, keyless with the GitHub identity)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        continue-on-error: true
      - name: Install cosign by hand if the installer could not download it
        if: github.event_name != 'pull_request'
        run: |
          command -v cosign >/dev/null && exit 0
          ARCH=$(uname -m); case "$ARCH" in aarch64) A=arm64;; *) A=amd64;; esac
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/v2.5.2/cosign-linux-$A"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign && cosign version
      - if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          cosign sign --yes "$IMAGE:${{ steps.meta.outputs.tag }}"
          # and with the Genesis release key, which installed systems require (policy.json in the image)
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Build qcow2
        run: |
          mkdir -p out
          for i in 1 2 3 4 5; do sudo podman pull -q $BIB >/dev/null 2>&1 && break; echo "retrying the image-builder pull ($i)"; sleep 20; done
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/out:/output" -v "$PWD/iso/config.toml:/config.toml:ro" \
            -v "$PWD/iso/defs/genesis-44.yaml:/usr/share/bootc-image-builder/defs/genesis-44.yaml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            $BIB --type qcow2 --rootfs btrfs --config /config.toml $IMAGE:stable
          sudo chown -R "$USER" out; ls -la out/qcow2; df -h / | tail -1

      - name: Boot test (qcow2, QEMU/KVM, serial console)
        run: |
          set -o pipefail
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf expect
          # GitHub runners expose /dev/kvm but only root may open it
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else echo "no KVM, using TCG"; ACCEL="-cpu max"; fi
          FW=/usr/share/ovmf/OVMF.fd; [ -f "$FW" ] || FW=/usr/share/OVMF/OVMF.fd; [ -f "$FW" ] || { ls /usr/share/ovmf /usr/share/OVMF; exit 1; }
          cp out/qcow2/disk.qcow2 boot.qcow2
          export ACCEL FW
          cat > boot.exp <<'EOF'
          set timeout 600
          log_file -noappend boot-serial.log
          spawn qemu-system-x86_64 {*}$env(ACCEL) -m 4096 -smp 2 -nographic -bios $env(FW) -drive file=boot.qcow2,if=virtio,format=qcow2 -serial mon:stdio -display none
          expect {
            -re "login: *$" { send "genesis\r" }
            timeout { puts "\nTIMEOUT: no login prompt on serial console"; exit 1 }
            eof     { puts "\nQEMU exited before login prompt"; exit 1 }
          }
          expect {
            -re "Password: *$" { send "genesis\r" }
            timeout { puts "\nTIMEOUT: no password prompt"; exit 1 }
          }
          # wait for a shell prompt (bash '$ ', starship '❯ ', root '# '); bounded fallback if the prompt is unusual
          set timeout 60
          expect {
            -re {(\$|❯|#) *$} { puts "\nprompt seen" }
            timeout { puts "\nno recognised prompt within 60s, continuing anyway" }
          }
          sleep 2
          send "\r"
          sleep 2
          # markers are split so the echoed command line cannot match them
          set timeout 180
          send "echo BOOTTEST-BE\"\"GIN; grep --color=never -E '^(ID|PRETTY_NAME|IMAGE_ID)=' /etc/os-release; hostname; echo HOSTDIAG; ls -la /etc/hostname /etc/os-release 2>&1; grep --color=never -H DEFAULT_HOSTNAME /etc/os-release /usr/lib/os-release 2>&1; sudo -n cat /etc/hostname 2>&1; hostnamectl status 2>&1 | head -5; echo HOSTDIAG-END; systemctl is-active genesis-probe.service; test -s /etc/genesis/profile.json && echo PROFILE-OK; grep -o 'recommended_pack\[^,\]*' /etc/genesis/profile.json; systemctl is-enabled genesis-router.service; systemctl is-active genesis-router.service; systemctl is-active genesis-firstrun.service; for _ in \$(seq 1 30); do curl -s -m 3 http://127.0.0.1:11510/api/state | grep -q recommended_pack && break; sleep 2; done; curl -s http://127.0.0.1:11510/api/state | grep -o 'recommended_pack\[^,\]*' | head -1 | sed 's/^/WIZARD-API /'; genesis-image-check | tail -4; echo BOOTTEST-DO\"\"NE\r"
          expect {
            "BOOTTEST-DONE" { puts "\nboot test reached shell and ran checks" }
            timeout { puts "\nTIMEOUT: command did not complete"; exit 1 }
            eof     { puts "\nQEMU exited during checks"; exit 1 }
          }
          send "exit\r"
          sleep 1
          exit 0
          EOF
          timeout 900 expect -f boot.exp
          # the console carries colour escapes (grep aliases, systemd): check a stripped copy
          sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g; s/\x1b\]8;;[^\x07]*\x07//g' boot-serial.log > boot-serial.clean
          echo "=== checks"
          grep -q 'ID=genesis' boot-serial.clean && echo "ok  os-release ID=genesis" || { echo "missing: os-release ID=genesis"; exit 1; }
          grep -qE '^enabled' boot-serial.clean && echo "ok  genesis-router.service enabled" || { echo "missing: genesis-router.service enabled"; exit 1; }
          grep -qE '^active|^inactive' boot-serial.clean && echo "ok  socket state reported" || { echo "missing: socket state reported"; exit 1; }
          grep -q 'PROFILE-OK' boot-serial.clean && echo "ok  first-boot profile written" || { echo "missing: first-boot profile written"; exit 1; }
          # The wizard starts after the network is up and the hardware probe has run, so the command above
          # waits up to a minute for it rather than asking the instant a shell appears. The canary lost
          # exactly this race and held every installed machine's updates for a day; the same question was
          # being asked the same way here, in a second workflow, and it failed a build that was fine.
          grep -q 'WIZARD-API recommended_pack' boot-serial.clean && echo "ok  first-run wizard API answers" || { echo "missing: first-run wizard API answers"; exit 1; }
          grep -o 'recommended_pack[^,]*' boot-serial.log | head -1

      - name: Screenshots under KVM, headless (login, first run, desktop, menu, Genesis)
        continue-on-error: true
        run: |
          mkdir -p shots
          FW=/usr/share/ovmf/OVMF.fd; [ -f "$FW" ] || FW=/usr/share/OVMF/OVMF.fd
          LOGIN_AT=150 timeout 900 python3 prototype/ci-shots.py out/qcow2/disk.qcow2 "$FW" shots || true
          rm -f shots/work.qcow2 shots/mon.sock
          ls -la shots

      - name: Publish screenshots to docs/screens/latest (docs are outside the CI path filter)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          ls shots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          git config user.name "genesis-ci"; git config user.email "ci@users.noreply.github.com"
          git fetch -q origin main && git checkout -q -B main origin/main
          mkdir -p docs/screens/latest && cp shots/*.png docs/screens/latest/
          printf '# Latest screenshots\n\nTaken automatically by CI from release %s under KVM. Login, first run, desktop, app menu, palette.\n' "${{ steps.meta.outputs.tag }}" > docs/screens/latest/README.md
          git add docs/screens/latest && git commit -qm "screens: automatic capture from release ${{ steps.meta.outputs.tag }} [skip ci]" && git push -q origin main || echo "nothing to publish"

      - name: Package qcow2 for release (2 GB per-asset limit -> zstd + split)
        run: |
          sudo apt-get install -y -q zstd
          mkdir -p release
          zstd -T0 -6 --rm -q -o release/genesis-${{ steps.meta.outputs.tag }}.qcow2.zst out/qcow2/disk.qcow2
          cd release
          split -b 1900M -d --additional-suffix=.part genesis-${{ steps.meta.outputs.tag }}.qcow2.zst genesis-${{ steps.meta.outputs.tag }}.qcow2.zst.
          rm genesis-${{ steps.meta.outputs.tag }}.qcow2.zst
          sha256sum *.part > SHA256SUMS.qcow2
          cp ../boot-serial.log .
          ls -la

      - name: Upload boot log (small artifact only; repo is private, artifact storage is limited)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-${{ steps.meta.outputs.tag }}
          path: boot-serial.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Release qcow2 (prerelease)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.tag }}
          name: Genesis ${{ steps.meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            Built from <https://github.com/${{ github.repository }}/commit/${{ github.sha }}>

            Image: `ghcr.io/${{ github.repository_owner }}/genesis:${{ steps.meta.outputs.tag }}`

            To tell whether a fix is in this release, compare that commit with the one you are looking for:

                git merge-base --is-ancestor <your-commit> ${{ github.sha }} && echo "it is in this build"

            The number in the version comes from the build's run number, which records when a build started.
            The commit above is what it was actually built from, and is the thing to trust.

            Disk image (QEMU/UTM/virt-manager), split because of GitHub's 2 GB asset limit:

                cat genesis-${{ steps.meta.outputs.tag }}.qcow2.zst.*.part | zstd -d -o disk.qcow2

            Installer ISO parts are attached by the `iso` job when it succeeds:

                cat genesis-${{ steps.meta.outputs.tag }}.iso.*.part > genesis.iso

            Login for boot tests: `genesis` / `genesis`. Boot-test serial log attached.
          files: |
            release/*
            shots/*.png

  # ---------------------------------------------------------------------------------------
  # Job 3: arm64 flavour (plain Fedora bootc + Plasma installed by us) -> push -> qcow2 -> release
  #        Runs natively on Apple Silicon Macs under Apple's hypervisor (prototype/vm-dev-arm.sh).
  # ---------------------------------------------------------------------------------------
  image-arm64:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Base image pins
        run: |
          grep -E "^[A-Z]+_REF=" .github/base-pins.env >> "$GITHUB_ENV"; echo "BIB=$(grep ^BIB_REF= .github/base-pins.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          # the mirror lives on GHCR: log in before the first pull (a private package needs it, a public one does not mind)
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null 2>&1 || true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h / | tail -1

      - name: Pull base images
        run: |
          for img in ${FEDORA_REF} docker.io/library/rust:1-bookworm quay.io/fedora/fedora:44; do
            for i in 1 2 3 4 5 6; do sudo podman pull --platform linux/arm64 $img && break; echo "pull attempt $i failed, waiting"; sleep 30; done
          done

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build arm64 image
        run: |
          sudo podman build -f Containerfile --pull=missing --platform linux/arm64 --layers \
            --cache-from $IMAGE-cache-arm64 --cache-to $IMAGE-cache-arm64 --cache-ttl 168h \
            --build-arg BASE=${FEDORA_REF} --build-arg FLAVOUR=fedora \
            --build-arg BOOTC_LINT=strict --build-arg GENESIS_VERSION=${{ needs.image.outputs.tag }}-arm64 \
            -t $IMAGE:stable-arm64 -t $IMAGE:0.1-arm64 -t $IMAGE:${{ needs.image.outputs.tag }}-arm64 . \
          || sudo podman build -f Containerfile --pull=missing --platform linux/arm64 --layers \
            --cache-from $IMAGE-cache-arm64 \
            --build-arg BASE=${FEDORA_REF} --build-arg FLAVOUR=fedora \
            --build-arg BOOTC_LINT=strict --build-arg GENESIS_VERSION=${{ needs.image.outputs.tag }}-arm64 \
            -t $IMAGE:stable-arm64 -t $IMAGE:0.1-arm64 -t $IMAGE:${{ needs.image.outputs.tag }}-arm64 .

      - name: Image self-check
        run: sudo podman run --rm $IMAGE:stable-arm64 genesis-image-check

      - name: Push
        run: |
          sudo podman tag $IMAGE:stable-arm64 $IMAGE:testing-arm64 && sudo podman push $IMAGE:testing-arm64
          sudo podman push $IMAGE:0.1-arm64
          sudo podman push $IMAGE:${{ needs.image.outputs.tag }}-arm64

      - name: Sign the image (sigstore, keyless)
        uses: sigstore/cosign-installer@v3
        continue-on-error: true
      - name: Install cosign by hand if the installer could not download it
        run: |
          command -v cosign >/dev/null && exit 0
          ARCH=$(uname -m); case "$ARCH" in aarch64) A=arm64;; *) A=amd64;; esac
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/v2.5.2/cosign-linux-$A"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign && cosign version
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          cosign sign --yes "$IMAGE:${{ needs.image.outputs.tag }}-arm64"
          # and with the Genesis release key, which installed systems require (policy.json in the image)
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE:${{ needs.image.outputs.tag }}-arm64"

      - name: Build qcow2 (aarch64)
        run: |
          mkdir -p out
          for i in 1 2 3 4 5; do sudo podman pull -q $BIB >/dev/null 2>&1 && break; echo "retrying the image-builder pull ($i)"; sleep 20; done
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/out:/output" -v "$PWD/iso/config.toml:/config.toml:ro" \
            -v "$PWD/iso/defs/genesis-44.yaml:/usr/share/bootc-image-builder/defs/genesis-44.yaml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            $BIB --type qcow2 --rootfs btrfs --config /config.toml $IMAGE:stable-arm64
          sudo chown -R "$USER" out; ls -la out/qcow2

      - name: Package qcow2 for release
        run: |
          sudo apt-get install -y -q zstd
          mkdir -p release
          zstd -T0 -6 --rm -q -o release/genesis-${{ needs.image.outputs.tag }}-arm64.qcow2.zst out/qcow2/disk.qcow2
          cd release
          split -b 1900M -d --additional-suffix=.part genesis-${{ needs.image.outputs.tag }}-arm64.qcow2.zst genesis-${{ needs.image.outputs.tag }}-arm64.qcow2.zst.
          rm genesis-${{ needs.image.outputs.tag }}-arm64.qcow2.zst
          sha256sum *.part > SHA256SUMS.qcow2-arm64
          ls -la

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.image.outputs.tag }}
          prerelease: true
          files: |
            release/*.part
            release/SHA256SUMS.qcow2-arm64

  # ---------------------------------------------------------------------------------------
  # Job 4: NVIDIA flavour (x86_64, Aurora's nvidia-open base): image only, self-checked, pushed, signed.
  #        Installed systems switch with: bootc switch ghcr.io/<owner>/genesis:0.1-nvidia
  # ---------------------------------------------------------------------------------------
  image-nvidia:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Base image pins
        run: |
          grep -E "^[A-Z]+_REF=" .github/base-pins.env >> "$GITHUB_ENV"; echo "BIB=$(grep ^BIB_REF= .github/base-pins.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          # the mirror lives on GHCR: log in before the first pull (a private package needs it, a public one does not mind)
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null 2>&1 || true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
      - name: Pull base images
        run: |
          for img in ${NVIDIA_REF} docker.io/library/rust:1-bookworm quay.io/fedora/fedora:44; do
            for i in 1 2 3 4 5 6; do sudo podman pull $img && break; echo "pull attempt $i failed, waiting"; sleep 30; done
          done
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build
        run: |
          sudo podman build -f Containerfile --pull=never --layers \
            --cache-from $IMAGE-cache --cache-to $IMAGE-cache-nvidia --cache-ttl 168h \
            --build-arg BASE=${NVIDIA_REF} \
            --build-arg BOOTC_LINT=strict --build-arg GENESIS_VERSION=${{ needs.image.outputs.tag }}-nvidia \
            -t $IMAGE:stable-nvidia -t $IMAGE:0.1-nvidia -t $IMAGE:${{ needs.image.outputs.tag }}-nvidia . \
          || sudo podman build -f Containerfile --pull=never --layers \
            --build-arg BASE=${NVIDIA_REF} \
            --build-arg BOOTC_LINT=strict --build-arg GENESIS_VERSION=${{ needs.image.outputs.tag }}-nvidia \
            -t $IMAGE:stable-nvidia -t $IMAGE:0.1-nvidia -t $IMAGE:${{ needs.image.outputs.tag }}-nvidia .
      - name: Image self-check
        run: sudo podman run --rm $IMAGE:stable-nvidia genesis-image-check
      - name: Push
        run: |
          sudo podman tag $IMAGE:stable-nvidia $IMAGE:testing-nvidia && sudo podman push $IMAGE:testing-nvidia
          sudo podman push $IMAGE:0.1-nvidia
          sudo podman push $IMAGE:${{ needs.image.outputs.tag }}-nvidia
      - name: Sign the image (sigstore, keyless)
        uses: sigstore/cosign-installer@v3
        continue-on-error: true
      - name: Install cosign by hand if the installer could not download it
        run: |
          command -v cosign >/dev/null && exit 0
          ARCH=$(uname -m); case "$ARCH" in aarch64) A=arm64;; *) A=amd64;; esac
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/v2.5.2/cosign-linux-$A"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign && cosign version
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          cosign sign --yes "$IMAGE:${{ needs.image.outputs.tag }}-nvidia"
          # and with the Genesis release key, which installed systems require (policy.json in the image)
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE:${{ needs.image.outputs.tag }}-nvidia"

  # ---------------------------------------------------------------------------------------
  # Job 2: installer ISO from the pushed image; attaches to the same release. Does not block job 1.
  # ---------------------------------------------------------------------------------------
  iso:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Base image pins
        run: |
          grep -E "^[A-Z]+_REF=" .github/base-pins.env >> "$GITHUB_ENV"; echo "BIB=$(grep ^BIB_REF= .github/base-pins.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          # the mirror lives on GHCR: log in before the first pull (a private package needs it, a public one does not mind)
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null 2>&1 || true

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/lib/jvm \
                      /usr/local/julia* /opt/microsoft /usr/share/miniconda /usr/local/share/chromium /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean; df -h / | tail -1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Genesis image
        run: |
          for i in 1 2 3 4 5 6; do sudo podman pull $IMAGE:${{ needs.image.outputs.tag }} && break; sleep 30; done
          sudo podman tag $IMAGE:${{ needs.image.outputs.tag }} $IMAGE:0.1
          sudo podman tag $IMAGE:${{ needs.image.outputs.tag }} $IMAGE:stable

      - name: Build installer ISO
        run: |
          mkdir -p out
          for i in 1 2 3 4 5; do sudo podman pull -q $BIB >/dev/null 2>&1 && break; echo "retrying the image-builder pull ($i)"; sleep 20; done
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/out:/output" -v "$PWD/iso/config-iso.toml:/config.toml:ro" \
            -v "$PWD/iso/defs/genesis-44.yaml:/usr/share/bootc-image-builder/defs/genesis-44.yaml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            $BIB --type anaconda-iso --rootfs btrfs --config /config.toml $IMAGE:stable
          sudo chown -R "$USER" out; ls -la out/bootiso
          # the image is no longer needed on this runner; the models and the rebuilt ISO need the room
          sudo podman rmi -f $IMAGE:stable $IMAGE:0.1 $IMAGE:${{ needs.image.outputs.tag }} >/dev/null 2>&1 || true

      # The first boot used to be a four-gigabyte download before the assistant was real. The ISO now carries
      # the smallest pack -- the same signed definition first run would resolve, each file pulled from the
      # GHCR mirror by its own sha256 and checked -- and a kickstart %post copies it into place during the
      # install, so a machine answers the moment it is installed, offline. If any of that cannot be had, the
      # ISO ships without it and says so: first run downloads as before. bootc-image-builder cannot put files
      # on the ISO itself, so xorriso adds them after, replaying the boot records it made.
      - uses: oras-project/setup-oras@v1
      - name: Models for the first boot, onto the ISO
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          # this runner has neither skopeo nor xorriso; the first run of this step found out by shipping nothing
          sudo apt-get update -q >/dev/null 2>&1 || true
          sudo apt-get install -y -q xorriso skopeo >/dev/null 2>&1 || echo "::warning::apt could not install xorriso/skopeo"
          command -v skopeo >/dev/null || { echo "::warning::no skopeo on this runner; the ISO ships without models"; exit 0; }
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null 2>&1 || true
          mkdir -p payload/genesis-models pdef
          # sudo: an earlier step's `sudo podman login` left a root-owned auth file in the runner's XDG dir, and
          # skopeo as the runner user dies reading it -- the second run of this step found that out
          if ! sudo skopeo copy --remove-signatures "docker://ghcr.io/$OWNER/genesis-packs:tiny" "oci:pdef:tiny" 2>skopeo.err; then
            echo "::warning::the signed tiny pack could not be fetched; the ISO ships without models: $(tail -2 skopeo.err | tr '\n' ' ')"; exit 0; fi
          sudo chown -R "$USER" pdef
          python3 - <<'PY' > files.tsv || { echo "::warning::the tiny pack definition could not be read; the ISO ships without models"; exit 0; }
          import json, os
          idx = json.load(open("pdef/index.json")); m = idx["manifests"][0]["digest"].split(":",1)[1]
          man = json.load(open(f"pdef/blobs/sha256/{m}")); l = man["layers"][0]["digest"].split(":",1)[1]
          doc = json.load(open(f"pdef/blobs/sha256/{l}"))
          for f in doc.get("files", []):
              if f.get("optional") and f.get("role") not in ("stt", "tts"): continue
              print(f["role"], f["name"], f["sha256"], f.get("size", 0), sep="\t")
          PY
          n=0; total=0
          while IFS=$'\t' read -r role name sha size; do
            d="payload/genesis-models/$role"; mkdir -p "$d"
            if ! oras pull -o "$d" "ghcr.io/$OWNER/genesis-models:$sha" >/dev/null 2>&1; then echo "::warning::not mirrored, not shipped: $role/$name"; continue; fi
            f=$(ls -S "$d" | head -1); [ "$f" = "$name" ] || mv "$d/$f" "$d/$name"
            got=$(sha256sum "$d/$name" | cut -d" " -f1)
            if [ "$got" != "$sha" ]; then echo "::error::checksum mismatch for $role/$name; not shipped"; rm -f "$d/$name"; continue; fi
            n=$((n+1)); total=$((total + size)); echo "  shipped $role/$name ($((size/1048576)) MB)"
          done < files.tsv
          [ "$n" -gt 0 ] || { echo "::warning::no model file could be shipped; the ISO is as before"; exit 0; }
          ls -d payload/genesis-models/fast/*.gguf >/dev/null 2>&1 || { echo "::warning::the small model itself is missing; the ISO ships without models"; exit 0; }
          iso=$(ls out/bootiso/*.iso | head -1)
          xorriso -indev "$iso" -outdev "${iso}.new" -boot_image any replay -map payload/genesis-models /genesis-models -- 2>&1 | tail -3
          mv "${iso}.new" "$iso"
          echo "--- on the ISO now:"; xorriso -indev "$iso" -find /genesis-models -type f -- 2>/dev/null | head -12
          echo "--- ISO with $n model files ($((total/1048576)) MB): $(du -h "$iso" | cut -f1)"
          rm -rf payload pdef

      # The installer wears Genesis. Anaconda unpacks /images/product.img from the install medium over its
      # own root before it starts (dracut anaconda-lib.sh, anaconda_auto_updates), and the base profile
      # loads /usr/share/anaconda/pixmaps/fedora.css -- so a product.img that carries that file, with our
      # colours and our logo at the stock selectors, brands the installer without a profile switch. The
      # pictures and the stylesheet are in iso/branding/. If xorriso is missing the ISO ships unbranded.
      - name: The installer wears Genesis (product.img)
        run: |
          set -uo pipefail
          command -v xorriso >/dev/null || sudo apt-get install -y -q xorriso >/dev/null 2>&1 || { echo "::warning::no xorriso; the installer ships unbranded"; exit 0; }
          rm -rf product && mkdir -p product/usr/share/anaconda/pixmaps
          cp iso/branding/sidebar-logo.png iso/branding/sidebar-bg.png iso/branding/topbar-bg.png product/usr/share/anaconda/pixmaps/
          cp iso/branding/genesis.css product/usr/share/anaconda/pixmaps/fedora.css
          ( cd product && find . -type f | cpio -o -H newc --quiet | gzip -9 ) > product.img
          ls -la product.img | awk '{print $5, "bytes of product.img"}'
          iso=$(ls out/bootiso/*.iso | head -1)
          xorriso -indev "$iso" -outdev "${iso}.new" -boot_image any replay -map product.img /images/product.img -- 2>&1 | tail -2
          mv "${iso}.new" "$iso"
          xorriso -indev "$iso" -find /images -type f -- 2>/dev/null | grep -q product.img && echo "product.img is on the ISO" || echo "::warning::product.img did not land on the ISO"
          echo "--- the installer's files:"; xorriso -indev "$iso" -find /images /EFI /genesis-models -maxdepth 2 -- 2>/dev/null | head -24
          rm -rf product product.img

      # The only test there is for an installer's look: boot the ISO and photograph it. Ninety seconds in,
      # Anaconda's language screen is up; the picture is attached to the run. No install happens.
      - name: Photograph the installer
        continue-on-error: true
        run: |
          set -uo pipefail
          sudo apt-get update -q >/dev/null 2>&1 || true
          sudo apt-get install -y -q qemu-system-x86 ovmf socat imagemagick >/dev/null 2>&1 || { echo "::warning::apt could not install qemu/ovmf/socat/imagemagick; no installer photograph"; exit 0; }
          iso=$(ls out/bootiso/*.iso | head -1); FW=/usr/share/ovmf/OVMF.fd; [ -f "$FW" ] || FW=/usr/share/OVMF/OVMF.fd
          [ -f "$FW" ] || { echo "::warning::no OVMF firmware; no installer photograph"; exit 0; }
          # KVM the way the canary gets it; without it the installer is still in the initrd at two minutes
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules 2>/dev/null; sudo udevadm trigger --name-match=kvm 2>/dev/null; sudo chmod 0666 /dev/kvm 2>/dev/null || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; echo "kvm: yes"; else ACCEL="-cpu max"; echo "kvm: no (emulated, slow)"; fi
          nohup qemu-system-x86_64 $ACCEL -m 4096 -smp 2 -bios "$FW" -cdrom "$iso" -boot d -display none -vga std \
            -monitor unix:/tmp/qemu-mon.sock,server,nowait -serial file:installer-serial.log >/dev/null 2>&1 &
          Q=$!; mkdir -p installer-shots
          last=0; for t in 60 120 200 300; do sleep $(( t - last )); last=$t; kill -0 $Q 2>/dev/null || { echo "qemu exited early"; break; }; echo "screendump installer-shots/installer-${t}s.ppm" | socat - UNIX-CONNECT:/tmp/qemu-mon.sock 2>&1 | tail -1 || true; done
          kill $Q 2>/dev/null || true
          for f in installer-shots/*.ppm; do [ -f "$f" ] && convert "$f" "${f%.ppm}.png" && rm -f "$f"; done
          ls -la installer-shots
          grep -iE "product.img|updates|anaconda" installer-serial.log 2>/dev/null | head -5 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-screens
          path: installer-shots/
          if-no-files-found: ignore

      - name: Package ISO for release (split)
        run: |
          mkdir -p release && cd release
          iso=$(ls ../out/bootiso/*.iso | head -1)
          split -b 1900M -d --additional-suffix=.part "$iso" genesis-${{ needs.image.outputs.tag }}.iso.
          sha256sum "$iso" *.part > SHA256SUMS.iso
          ls -la

      - name: Attach ISO to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.image.outputs.tag }}
          prerelease: true
          files: |
            release/*
            shots/*.png
