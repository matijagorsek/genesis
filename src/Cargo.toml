[workspace]
resolver = "2"
members = ["genesis-permd", "genesis-probe", "genesis-firstrun", "genesis-agentd", "genesis-companiond", "genesis-txd", "genesis-krunner", "genesis-ask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/matijagorsek/genesis"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["fs"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
