[package]
name = "genesis-companiond"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Genesis on your phone: a TLS API on the local network for the companion app, paired by QR, proxied to the maker"

[[bin]]
name = "genesis-companiond"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
rcgen = "0.13"
