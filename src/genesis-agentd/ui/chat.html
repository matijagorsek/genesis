<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat with Genesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0d1117;--panel:#141a22;--line:#233040;--ink:#e6edf3;--muted:#8b98a8;--accent:#2dd4bf;--second:#8b7cf6;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:280px 1fr;grid-template-rows:48px 1fr}
  header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header b{font-size:15px}
  .badge{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
  .badge.local{border-color:var(--accent);color:var(--accent)}
  .sp{flex:1}
  button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent)} button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:#04211d;border-color:var(--accent);font-weight:600}
  aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  aside .top{padding:10px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
  aside input{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
  #list{overflow:auto;flex:1}
  .item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover,.item.active{background:#1b2431}
  .item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{display:flex;flex-direction:column;min-height:0}
  #msgs{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .m{max-width:760px;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
  .m.user{align-self:flex-end;background:#1d2a3a;border:1px solid #2a3b52}
  .m.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .m .att{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  .m code{background:#0b0f14;padding:1px 4px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:13px}
  .m pre{background:#0b0f14;padding:10px;border-radius:8px;overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:13px}
  .chip{align-self:flex-start;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
  .card{align-self:flex-start;background:#1a1f2a;border:1px solid var(--warn);border-radius:12px;padding:12px 14px;max-width:760px}
  .card .row{display:flex;gap:8px;margin-top:8px}
  .thinking{color:var(--muted);font-style:italic}
  #composer{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
  #composer .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:none;min-height:44px;max-height:180px}
  #attach{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
  #attach input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;min-width:340px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:520px}
  .empty h1{color:var(--ink);font-weight:600;font-size:22px;margin-bottom:6px}
  .ideas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .ideas button{font-size:13px}
  @media (max-width:760px){body{grid-template-columns:1fr}aside{display:none}header{grid-column:1}}
</style></head>
<body>
<header>
  <b>Chat with Genesis</b>
  <span class="badge local">on this machine</span>
  <span class="badge" id="badgeModel">model: …</span>
  <span class="sp"></span>
  <button id="makerBtn" title="The maker: build and change things">Maker</button>
  <button id="settingsBtn" title="Genesis settings">Settings</button>
</header>
<aside aria-label="Conversations">
  <div class="top"><input id="q" placeholder="Search your chats" aria-label="Search your chats"><button id="newBtn" class="primary" title="New chat">New</button></div>
  <div id="list" role="list"></div>
</aside>
<main>
  <div id="msgs" aria-live="polite"></div>
  <div id="composer">
    <div id="attach"><span>Attach:</span><input id="attPath" placeholder="a file path: a PDF, a document, a photo…" aria-label="File to attach"><button id="attAdd">Add</button><span id="attList"></span></div>
    <div class="row"><textarea id="text" placeholder="Ask anything. Your notes and documents, this computer, or the web." aria-label="Your message"></textarea><button id="mic" title="Hold to talk" aria-label="Hold to talk">🎤</button><button id="send" class="primary">Send</button></div>
  </div>
</main>
<script>
  const GENESIS_TOKEN='__GENESIS_TOKEN__';(function(){const f=window.fetch.bind(window);window.fetch=(u,o)=>{o=o||{};const h=new Headers(o.headers||{});h.set('X-Genesis-Token',GENESIS_TOKEN);o.headers=h;return f(u,o)}})();
  const I18N={"de":{"Chat with Genesis":"Chat mit Genesis","on this machine":"auf diesem Rechner","Maker":"Maker","Settings":"Einstellungen","Search your chats":"Chats durchsuchen","New":"Neu","Attach:":"Anhängen:","Add":"Hinzufügen","Send":"Senden","Hold to talk":"Zum Sprechen halten","Ask anything. Your notes and documents, this computer, or the web.":"Frag irgendetwas. Deine Notizen und Dokumente, diesen Rechner oder das Web.","What do you want to know?":"Was möchtest du wissen?","Everything stays on this machine. Ask about your notes and documents, this computer, or the web; every chat is kept here and searchable.":"Alles bleibt auf diesem Rechner. Frag nach deinen Notizen und Dokumenten, diesem Rechner oder dem Web; jeder Chat bleibt hier und ist durchsuchbar.","New chat":"Neuer Chat","Allow once":"Einmal erlauben","Not now":"Jetzt nicht","Delete this chat":"Diesen Chat löschen"},"sl":{"Chat with Genesis":"Klepet z Genesis","on this machine":"na tem računalniku","Maker":"Izdelovalec","Settings":"Nastavitve","Search your chats":"Išči po klepetih","New":"Nov","Attach:":"Priloži:","Add":"Dodaj","Send":"Pošlji","Hold to talk":"Drži za govor","Ask anything. Your notes and documents, this computer, or the web.":"Vprašaj karkoli. Svoje zapiske in dokumente, ta računalnik ali splet.","What do you want to know?":"Kaj želiš vedeti?","Everything stays on this machine. Ask about your notes and documents, this computer, or the web; every chat is kept here and searchable.":"Vse ostane na tem računalniku. Vprašaj o svojih zapiskih in dokumentih, tem računalniku ali spletu; vsak klepet je shranjen tukaj in ga je mogoče iskati.","New chat":"Nov klepet","Allow once":"Dovoli enkrat","Not now":"Ne zdaj","Delete this chat":"Izbriši ta klepet"}};
  const LANG=(navigator.language||'en').slice(0,2);const T=I18N[LANG]||{};const t=s=>T[s]||s;
  function localise(root){if(!I18N[LANG])return;const walk=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);let n;while((n=walk.nextNode())){const raw=n.nodeValue.trim();if(raw&&T[raw])n.nodeValue=n.nodeValue.replace(raw,T[raw])}(root||document).querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{for(const a of ['placeholder','title','aria-label']){const v=el.getAttribute(a);if(v&&T[v])el.setAttribute(a,T[v])}})}
  localise();
  const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  async function api(p,body,method){const r=await fetch(p,body?{method:method||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:(method?{method}:{}));try{return await r.json()}catch{return {}}}
  // plain text with code fences and inline code; everything else stays literal
  function render(text){const parts=String(text).split(/```/);return parts.map((p,i)=>i%2?'<pre>'+esc(p.replace(/^[a-z]*\n/,''))+'</pre>':esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>')).join('')}
  function verb(p){const a=p.args||{};const tl=p.tool;if(tl.startsWith('mcp__')){const m=tl.split('__');return['use your '+(m[1]||'')+' tool: '+(m.slice(2).join('__')||''),JSON.stringify(a).slice(0,200)]}
    if(tl==='read_file'||tl==='list_dir'||tl==='read_document')return['read a file',a.path||''];if(tl==='browser_open')return['open a web page',a.url||''];if(tl==='browser_click'||tl==='browser_type')return['act on the web page',a.text||('element '+a.n)];if(tl==='search_files')return['search your files',a.query||''];return[tl.replace(/_/g,' '),JSON.stringify(a).slice(0,120)]}
  let current=null,session=null,poll=null,seen=0,attachments=[];
  $('#makerBtn').addEventListener('click',()=>{location.href='/'});$('#settingsBtn').addEventListener('click',()=>{location.href='/settings'});
  async function loadList(){const q=$('#q').value.trim();const list=await api('/api/chats'+(q?'?q='+encodeURIComponent(q):''));const box=$('#list');box.innerHTML='';(Array.isArray(list)?list:[]).forEach(c=>{const d=document.createElement('div');d.className='item'+(c.id===current?' active':'');d.setAttribute('role','listitem');d.innerHTML='<b>'+esc(c.title)+'</b><small>'+esc(c.snippet||(c.messages+' messages'))+'</small>';d.addEventListener('click',()=>open(c.id));box.appendChild(d)});localise(box)}
  $('#q').addEventListener('input',()=>{clearTimeout(window.__qt);window.__qt=setTimeout(loadList,250)});
  function empty(){$('#msgs').innerHTML='<div class="empty"><h1>What do you want to know?</h1><p>Everything stays on this machine. Ask about your notes and documents, this computer, or the web; every chat is kept here and searchable.</p><div class="ideas">'+['What did I write about last week?','Is a Genesis update waiting?','Summarise this PDF for me','Which apps are installed?','Explain what a bootc image is'].map(s=>'<button data-idea="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div></div>';$('#msgs').querySelectorAll('[data-idea]').forEach(b=>b.addEventListener('click',()=>{$('#text').value=b.dataset.idea;$('#text').focus()}));localise($('#msgs'))}
  function addMsg(m){const box=$('#msgs');if(box.querySelector('.empty'))box.innerHTML='';const d=document.createElement('div');d.className='m '+m.role;d.innerHTML=render(m.text)+((m.attachments||[]).length?'<span class="att">📎 '+esc(m.attachments.join(', '))+'</span>':'');box.appendChild(d);box.scrollTop=box.scrollHeight;return d}
  async function open(id){current=id;attachments=[];renderAtt();clearInterval(poll);seen=0;const r=await api('/api/chats/'+id);if(r.error){empty();return}const box=$('#msgs');box.innerHTML='';if(!r.chat.messages.length)empty();r.chat.messages.forEach(addMsg);session=r.session;loadList();if(session)watch()}
  async function newChat(){const c=await api('/api/chats',{title:''});if(c.id){await open(c.id)}}
  $('#newBtn').addEventListener('click',newChat);
  function renderAtt(){$('#attList').innerHTML=attachments.map((a,i)=>'<span class="tag">'+esc(a.split('/').pop())+' <a href="#" data-i="'+i+'" aria-label="remove">✕</a></span>').join(' ');$('#attList').querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();attachments.splice(+a.dataset.i,1);renderAtt()}))}
  $('#attAdd').addEventListener('click',()=>{const p=$('#attPath').value.trim();if(p){attachments.push(p);$('#attPath').value='';renderAtt()}});
  async function send(){const text=$('#text').value.trim();if(!text)return;if(!current){const c=await api('/api/chats',{title:''});if(!c.id)return;current=c.id;$('#msgs').innerHTML=''}
    const r=await api('/api/chats/'+current+'/say',{text,attachments});if(r.error){alert(r.error);return}
    addMsg({role:'user',text,attachments});$('#text').value='';attachments=[];renderAtt();session=r.session;seen=0;const th=document.createElement('div');th.className='thinking';th.id='thinking';th.textContent='…';$('#msgs').appendChild(th);watch()}
  $('#send').addEventListener('click',send);$('#text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  function watch(){clearInterval(poll);poll=setInterval(async()=>{if(!session)return;const s=await api('/api/sessions/'+session);if(s.error){clearInterval(poll);return}
    const ev=(s.events||[]).slice(seen);seen=(s.events||[]).length;const box=$('#msgs');ev.forEach(e=>{if(e.kind==='tool_call'){const v=verb({tool:e.name,args:e.args});const c=document.createElement('div');c.className='chip';c.textContent=v[0]+(v[1]?' · '+v[1]:'');box.appendChild(c)}
      if(e.kind==='assistant'&&(s.state==='done'||s.state==='running')){/* the final text lands via the chat file */}
      if(e.kind==='error'){const c=document.createElement('div');c.className='chip';c.textContent='‼ '+e.text;box.appendChild(c)}});
    document.querySelectorAll('.card').forEach(c=>c.remove());(s.pending||[]).forEach(p=>{const v=verb(p);const c=document.createElement('div');c.className='card';c.innerHTML='<b>Genesis wants to '+esc(v[0])+'</b><div class="muted">'+esc(v[1])+'</div><div class="row"><button class="primary" data-ok="1">Allow once</button><button data-ok="0">Not now</button></div>';c.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{await api('/api/prompts/'+p.request_id,{allow:b.dataset.ok==='1'});c.remove()}));box.appendChild(c);localise(c)});
    if(s.state==='done'||s.state==='error'){clearInterval(poll);const th=$('#thinking');if(th)th.remove();const r=await api('/api/chats/'+current);const have=box.querySelectorAll('.m').length;(r.chat&&r.chat.messages||[]).slice(have).forEach(addMsg);loadList()}
    box.scrollTop=box.scrollHeight},1200)}
  // hold to talk: the same recorder as the palette
  (function(){const b=$('#mic');let rec=null,chunks=[];async function start(){try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const fd=new FormData();fd.append('audio',blob,'a.webm');const r=await fetch('/api/transcribe',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(j.text){$('#text').value=(($('#text').value+' '+j.text).trim());$('#text').focus()}};rec.start();b.classList.add('on')}catch(e){b.title='microphone not available'}}
    function stop(){if(rec&&rec.state!=='inactive')rec.stop();b.classList.remove('on')}
    b.addEventListener('mousedown',start);b.addEventListener('mouseup',stop);b.addEventListener('mouseleave',stop);b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!rec||rec.state==='inactive')start()}});b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stop()})})();
  (async()=>{try{const h=await api('/api/health');$('#badgeModel').textContent='model: '+(h.model||'…')}catch{}
    await loadList();const first=new URLSearchParams(location.search).get('id');if(first)open(first);else empty();
    const q=new URLSearchParams(location.search).get('prompt');if(q){$('#text').value=q;send()}})();
</script>
</body></html>
