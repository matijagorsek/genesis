<!doctype html>
<html><head><meta charset="utf-8"><title>Genesis</title>
<style>
:root{--bg:#10161e;--panel:#161d27;--panel-2:#1d2631;--line:#232c37;--ink:#e6ebf1;--ink-2:#a9b4c1;--ink-3:#8894a3;--accent:#5fb5bd}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;overflow:hidden}
.wrap{display:flex;flex-direction:column;gap:12px;padding:18px 20px;height:100%}
.top{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px}.top b{color:var(--ink);font-size:14px}.top .local{color:#6ccf94}
.ask{display:flex;gap:8px;align-items:stretch}.ask textarea{flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;font-size:18px;resize:none;height:88px;outline:none;overflow:hidden}.ask textarea:focus{border-color:var(--accent)}
.mic{font-size:20px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;user-select:none;touch-action:none;color:var(--ink)}.mic.rec{background:#a33;border-color:#e66}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;max-width:100%}.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}.chip button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:14px}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.phone-notes{margin-top:12px;display:flex;flex-direction:column;gap:6px}.pn{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px}.pn b{color:var(--ink)}.pn .t{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pn input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit;font-size:12.5px;width:180px}.pn .app{font-size:11px;color:var(--ink-3)}.starter{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.starter:hover{border-color:var(--accent);color:var(--ink)}
.foot{margin-top:auto;display:flex;gap:16px;color:var(--ink-3);font-size:12px}.foot kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}
body.listening .wrap{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 40px rgba(95,181,189,.25);transition:box-shadow .15s}@media (prefers-reduced-motion:reduce){body.listening .wrap{transition:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .confirm{margin:6px 0;color:var(--warn,#f59e0b);font-size:13px}
</style></head><body>
<div class="wrap" role="dialog" aria-label="Ask Genesis">
  <div class="top"><b>Genesis</b><span class="local">● on this machine</span><span id="hint">Tell it what you want made, or what to do with this.</span></div>
  <div class="ask"><textarea id="q" aria-label="What do you want made or done" placeholder="a timer, a tool that renames my photos, a website for the club…" autofocus></textarea><button id="mic" class="mic" title="Hold to talk" aria-label="Hold to talk" hidden>🎤</button></div>
  <div id="sel" hidden><span class="chip">Using your selection: <span id="selText"></span><button id="selDrop" title="Don't use the selection" aria-label="Don't use the selection">✕</button></span></div>
  <div class="starters" id="starters" role="list" aria-label="Starter ideas"></div>
  <div id="phoneNotes" class="phone-notes" hidden aria-live="polite"></div>
  <div class="foot" aria-hidden="true"><span><kbd>Enter</kbd> make it</span><span><kbd>Esc</kbd> close</span><span><kbd>hold 🎤</kbd> talk</span><span>Everything runs here. Nothing is sent anywhere.</span></div>
</div>
<script>
  // every call to this daemon carries the per-boot token the page was served with
  const GENESIS_TOKEN='__GENESIS_TOKEN__';(function(){const f=window.fetch.bind(window);window.fetch=(u,o)=>{o=o||{};const h=new Headers(o.headers||{});h.set('X-Genesis-Token',GENESIS_TOKEN);o.headers=h;return f(u,o)}})();
(function(){
  // Localisation: the person's language from the browser (KDE sets it from System Settings). English is the source.
  const I18N={"de":{"What do you want to make?":"Was möchtest du erstellen?","Make it":"Erstellen","Make something new":"Etwas Neues erstellen","Settings":"Einstellungen","on this machine":"auf diesem Computer","no network used":"kein Netzwerk verwendet","Describe an app, a tool or a script. Genesis builds it here with local models, shows it running, and can put it in your app menu.":"Beschreibe eine App, ein Werkzeug oder ein Skript. Genesis baut es hier mit lokalen Modellen, zeigt es laufend und kann es in dein App-Menü aufnehmen.","Made here":"Hier erstellt","Continue":"Weiter","Copy recipe":"Rezept kopieren","Export":"Exportieren","Send":"Senden","Install as app":"Als App installieren","Undo changes":"Änderungen rückgängig machen","Reload":"Neu laden","Open in browser":"Im Browser öffnen","Preview":"Vorschau","Not now":"Jetzt nicht","Allow once":"Einmal erlauben","Genesis wants to":"Genesis möchte","Tell it what you want made, or what to do with this.":"Sag, was erstellt werden soll, oder was damit zu tun ist.","make it":"erstellen","close":"schließen","talk":"sprechen","Everything runs here. Nothing is sent anywhere.":"Alles läuft hier. Nichts wird irgendwohin gesendet.","Using your selection:":"Mit deiner Auswahl:","You selected some text.":"Du hast Text ausgewählt.","a timer, a tool that renames my photos, a website for the club…":"ein Timer, ein Werkzeug, das meine Fotos umbenennt, eine Website für den Verein…","a checklist app that saves to a file":"eine Checklisten-App, die in eine Datei speichert","a pomodoro timer with a bell":"ein Pomodoro-Timer mit Glocke","rename the photos in a folder by date taken":"die Fotos in einem Ordner nach Aufnahmedatum umbenennen","a simple website for a club":"eine einfache Website für einen Verein","a word-count tool for text files":"ein Wortzähler für Textdateien","a script that renames photos in a folder by date taken":"ein Skript, das Fotos in einem Ordner nach Aufnahmedatum umbenennt","a simple website for a club with three pages":"eine einfache Vereins-Website mit drei Seiten","e.g. a pomodoro timer web app with a big countdown and a bell":"z. B. eine Pomodoro-Web-App mit großem Countdown und Glocke","Ask Genesis":"Genesis fragen","What do you want made or done":"Was soll gemacht oder erledigt werden","Hold to talk":"Zum Sprechen halten","Don't use the selection":"Auswahl nicht verwenden","Starter ideas":"Ideen zum Start","To phone":"Ans Handy","Send this text (or the selection) to your phone":"Diesen Text (oder die Auswahl) ans Handy senden","Sent to your phone":"Ans Handy gesendet"},"sl":{"What do you want to make?":"Kaj želiš ustvariti?","Make it":"Ustvari","Make something new":"Ustvari nekaj novega","Settings":"Nastavitve","on this machine":"na tem računalniku","no network used":"brez omrežja","Describe an app, a tool or a script. Genesis builds it here with local models, shows it running, and can put it in your app menu.":"Opiši aplikacijo, orodje ali skripto. Genesis jo zgradi tukaj z lokalnimi modeli, jo pokaže v teku in jo lahko doda v tvoj meni aplikacij.","Made here":"Ustvarjeno tukaj","Continue":"Nadaljuj","Copy recipe":"Kopiraj recept","Export":"Izvozi","Send":"Pošlji","Install as app":"Namesti kot aplikacijo","Undo changes":"Razveljavi spremembe","Reload":"Osveži","Open in browser":"Odpri v brskalniku","Preview":"Predogled","Not now":"Ne zdaj","Allow once":"Dovoli enkrat","Genesis wants to":"Genesis želi","Tell it what you want made, or what to do with this.":"Povej, kaj naj ustvari, ali kaj naj naredi s tem.","make it":"ustvari","close":"zapri","talk":"govori","Everything runs here. Nothing is sent anywhere.":"Vse teče tukaj. Nič se ne pošilja nikamor.","Using your selection:":"S tvojo izbiro:","You selected some text.":"Izbral si besedilo.","a timer, a tool that renames my photos, a website for the club…":"časovnik, orodje za preimenovanje fotografij, spletna stran za klub…","a checklist app that saves to a file":"aplikacija s seznamom opravil, ki shranjuje v datoteko","a pomodoro timer with a bell":"pomodoro časovnik z zvoncem","rename the photos in a folder by date taken":"preimenuj fotografije v mapi po datumu posnetka","a simple website for a club":"preprosta spletna stran za klub","a word-count tool for text files":"orodje za štetje besed v besedilnih datotekah","a script that renames photos in a folder by date taken":"skripta, ki preimenuje fotografije v mapi po datumu posnetka","a simple website for a club with three pages":"preprosta spletna stran za klub s tremi stranmi","e.g. a pomodoro timer web app with a big countdown and a bell":"npr. pomodoro spletna aplikacija z velikim odštevanjem in zvoncem","Ask Genesis":"Vprašaj Genesis","What do you want made or done":"Kaj naj bo narejeno ali opravljeno","Hold to talk":"Drži za govor","Don't use the selection":"Ne uporabi izbire","Starter ideas":"Ideje za začetek","To phone":"Na telefon","Send this text (or the selection) to your phone":"Pošlji to besedilo (ali izbiro) na telefon","Sent to your phone":"Poslano na telefon"}};
  const LANG=(navigator.language||'en').slice(0,2); const T=I18N[LANG]||{};
  function tr(s){return T[s]||s}
  function localise(root){if(!I18N[LANG])return;const walk=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);let n;while((n=walk.nextNode())){const raw=n.nodeValue.trim();const s=raw.replace(/^[●•\s]+/,'');if(s&&T[s])n.nodeValue=n.nodeValue.replace(s,T[s])}(root||document).querySelectorAll('[placeholder],[title]').forEach(el=>{for(const a of ['placeholder','title']){const v=el.getAttribute(a);if(v&&T[v])el.setAttribute(a,T[v])}})}

  const $=s=>document.querySelector(s);const q=$('#q');const params=new URLSearchParams(location.search);
  let selection=(params.get('selection')||'').trim();
  if(selection){$('#sel').hidden=false;$('#selText').textContent=selection.slice(0,140);q.placeholder='What should Genesis do with it? e.g. summarize, turn into a checklist, fix the grammar…';$('#hint').textContent='You selected some text.'}
  $('#selDrop').addEventListener('click',()=>{selection='';$('#sel').hidden=true;q.placeholder='a timer, a tool that renames my photos, a website for the club…';q.focus()});
  // what is on the phone right now (KDE Connect notification sync); replies go back through the phone
  async function phoneNotes(){try{const r=await (await fetch('/api/phone/notifications')).json();const box=document.getElementById('phoneNotes');const list=(r.notifications||[]).slice(0,4);
    if(!list.length){box.hidden=true;box.innerHTML='';return}
    const esc=x=>String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');box.innerHTML=list.map(n=>`<div class="pn"><span class="app">${esc(n.app)}</span><b>${esc(n.title)}</b><span class="t">${esc(n.text)}</span>${n.can_reply?`<input placeholder="Reply from here…" data-d="${esc(n.device)}" data-i="${esc(n.id)}" aria-label="Reply to ${esc(n.title)}">`:''}</div>`).join('');box.hidden=false;
    box.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',async e=>{if(e.key==='Enter'&&i.value.trim()){e.preventDefault();const t=i.value.trim();i.disabled=true;await fetch('/api/phone/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({device:i.dataset.d,id:i.dataset.i,text:t})});i.value='';i.placeholder='Sent';setTimeout(phoneNotes,1500)}}))}catch(e){}}
  phoneNotes();setInterval(phoneNotes,10000);
  const STARTERS=['a checklist app that saves to a file','a pomodoro timer with a bell','rename the photos in a folder by date taken','a simple website for a club','a word-count tool for text files'];
  STARTERS.forEach(t=>{const b=document.createElement('button');b.className='starter';b.setAttribute('role','listitem');b.textContent=tr(t);b.addEventListener('click',()=>go(t,true));$('#starters').appendChild(b)});
  // asking and making are different doors: a request to make something opens the maker, anything else
  // (a question, "summarise this", "translate") is answered in chat, where it is kept. Ctrl+Enter forces the maker.
  const MAKE=/^\s*(make|build|create|write|generate|scaffold|code|program|fix|add|change|install|rename|convert|sort|organi[sz]e|resize|merge|split|bau|baue|erstelle|mach|mache|schreib|programmier|naredi|ustvari|zgradi|napiši|napisi|sprogramiraj)\b|\b(app|tool|script|website|web ?page|game|widget|timer|calculator|converter|skript|werkzeug|webseite|spiel|aplikacij|orodje|skripta|spletna stran|igra)\b/i;
  function go(text,forceMake){text=(text||'').trim();if(!text&&!selection)return;const prompt=selection?(text||'Help me with this')+'\n\nSelected text:\n'+selection:text;const make=forceMake||(!selection&&MAKE.test(text));location.href=(make?'/?prompt=':'/chat?prompt=')+encodeURIComponent(prompt)}
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go(q.value,e.ctrlKey)}if(e.key==='Escape'){location.hash='close'}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')location.hash='close'});
  // hold to talk: 16 kHz WAV recorded here, transcribed by whisper.cpp on this machine
  function wavEncode(chunks, rate){let n=0;for(const c of chunks)n+=c.length;const ratio=rate/16000,len=Math.floor(n/ratio);const pcm=new Int16Array(len);let all=new Float32Array(n),o=0;for(const c of chunks){all.set(c,o);o+=c.length}
    for(let i=0;i<len;i++){const v=Math.max(-1,Math.min(1,all[Math.floor(i*ratio)]));pcm[i]=v<0?v*0x8000:v*0x7fff}
    const b=new ArrayBuffer(44+pcm.length*2),d=new DataView(b);const str=(p,s)=>{for(let i=0;i<s.length;i++)d.setUint8(p+i,s.charCodeAt(i))};
    str(0,'RIFF');d.setUint32(4,36+pcm.length*2,true);str(8,'WAVE');str(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,16000,true);d.setUint32(28,32000,true);d.setUint16(32,2,true);d.setUint16(34,16,true);str(36,'data');d.setUint32(40,pcm.length*2,true);new Int16Array(b,44).set(pcm);return new Blob([b],{type:'audio/wav'})}
  // Voice feedback within a few milliseconds of the press: a short chime and a glow, before the mic is even open.
  let __ac=null;function tone(f,ms,g){try{__ac=__ac||new (window.AudioContext||window.webkitAudioContext)();const o=__ac.createOscillator(),v=__ac.createGain();o.type='sine';o.frequency.value=f;v.gain.value=0;o.connect(v);v.connect(__ac.destination);const t=__ac.currentTime;v.gain.linearRampToValueAtTime(g||0.08,t+0.01);v.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);o.start(t);o.stop(t+ms/1000+0.02)}catch(e){}}
  function listenOn(btn){btn.classList.add('rec');document.body.classList.add('listening');tone(880,140)}
  function listenOff(btn){btn.classList.remove('rec');document.body.classList.remove('listening');tone(520,160)}
  const mic=$('#mic');let ctx,src,proc,chunks=[],stream;
  async function start(e){e.preventDefault();if(ctx)return;listenOn(mic);try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(err){mic.title='Microphone not available';listenOff(mic);return}ctx=new AudioContext();src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);chunks=[];proc.onaudioprocess=ev=>chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));src.connect(proc);proc.connect(ctx.destination);q.placeholder='Listening…'}
  async function stop(e){if(!ctx)return;e&&e.preventDefault();proc.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());const rate=ctx.sampleRate;await ctx.close();ctx=null;listenOff(mic);q.placeholder='Transcribing…';
    try{const r=await fetch('/api/transcribe',{method:'POST',headers:{'content-type':'audio/wav'},body:wavEncode(chunks,rate)});const j=await r.json();if(j.error)throw new Error(j.error);q.value=(q.value?q.value+' ':'')+j.text;q.placeholder='';
      // a spoken request that would install, delete or send is shown first and needs Enter (rule 8: risky spoken intents confirm)
      if(j.text&&/\b(install|uninstall|delete|remove|erase|wipe|format|send|pay|buy)\b/i.test(j.text)){q.placeholder='';q.setAttribute('aria-label','Check what was heard, then press Enter to send or Esc to cancel');const n=document.createElement('div');n.className='confirm';n.textContent='Heard: "'+j.text+'". Enter sends it, Esc cancels.';n.setAttribute('role','status');q.parentNode.insertBefore(n,q.nextSibling);q.focus();q.addEventListener('keydown',()=>n.remove(),{once:true});return}
      if(j.text)go(q.value)}catch(err){q.placeholder='Could not transcribe: '+err.message}}
  // "say it, it happens": opened with ?listen=1 (Meta+Shift+V), the palette listens at once and stops
  // on its own after a pause of 1.3 s following speech; nothing is sent while the room is silent
  if(params.get('listen')==='1'){setTimeout(async()=>{mic.hidden=false;await start(new Event('auto'));let spoke=false,quiet=0;const iv=setInterval(()=>{if(!chunks.length)return;const last=chunks[chunks.length-1];let e=0;for(let i=0;i<last.length;i++)e+=last[i]*last[i];const rms=Math.sqrt(e/last.length);if(rms>0.02){spoke=true;quiet=0}else if(spoke){quiet+=4096/(ctx?ctx.sampleRate:48000);if(quiet>1.3){clearInterval(iv);stop(new Event('auto'))}}},90);setTimeout(()=>{clearInterval(iv);if(ctx)stop(new Event('auto'))},15000)},300)}
  mic.addEventListener('pointerdown',start);mic.addEventListener('pointerup',stop);mic.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();start(e)}});mic.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();stop(e)}});mic.addEventListener('pointerleave',stop);
  fetch('/api/health').then(r=>r.json()).then(h=>{if(h.voice)mic.hidden=false}).catch(()=>{});
  // send to the phone: a button that appears when a phone is paired and reachable
  fetch('/api/phone').then(r=>r.json()).then(p=>{if(!(p.devices||[]).some(d=>d.paired&&d.reachable))return;const b=document.createElement('button');b.id='toPhone';b.textContent='To phone';b.title='Send this text (or the selection) to your phone';b.addEventListener('click',async()=>{const text=(q.value.trim()||selection||'');if(!text)return;const r=await fetch('/api/phone/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const j=await r.json().catch(()=>({}));q.placeholder=j.ok?'Sent to your phone':('Could not send: '+(j.error||''));q.value=''});q.parentNode.appendChild(b);localise(b)}).catch(()=>{});
  q.focus();
  localise();
})();
</script></body></html>
