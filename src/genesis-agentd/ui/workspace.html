<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genesis</title>
<style>
:root{--bg:#10161e;--panel:#161d27;--panel-2:#1d2631;--ink:#e6ebf1;--ink-2:#a9b4c1;--ink-3:#6f7a89;--line:#232c37;--accent:#5fb5bd;--accent-ink:#08181a;--good:#6ccf94;--warn:#e0a84a;--bad:#ef7b7b;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:14px;line-height:1.5;display:grid;grid-template-rows:44px 1fr;height:100vh}
header{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:15px}
.badge{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.badge.local{border-color:var(--good);color:var(--good)}
.badge.local:before{content:"● ";}
.sp{flex:1}
select,input[type=text]{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)} button:focus-visible{outline:2px solid var(--accent);outline-offset:2px} button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
main{display:grid;grid-template-columns:260px 1fr;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
aside h3{margin:6px 0 2px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sess{border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13px}
.sess.sel{border-color:var(--accent)}
.sess .p{color:var(--ink-2);font-family:var(--mono);font-size:11px;word-break:break-all}
.sess .st{font-family:var(--mono);font-size:11px}
.st-running,.st-waiting{color:var(--warn)} .st-done{color:var(--good)} .st-error{color:var(--bad)} .st-idle{color:var(--ink-3)}
section{display:grid;grid-template-rows:1fr auto;min-height:0}
.stream{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:13.5px}
.ev .i{color:var(--ink-3);font-family:var(--mono);text-align:center}
.ev .t{white-space:pre-wrap;word-break:break-word}
.ev.user .t{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ev.assistant .t{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ev.tool .t{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.ev.decision .t{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ev.result .t{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ev.snapshot .t{font-family:var(--mono);font-size:12px;color:var(--accent)}
.ev.error .t{color:var(--bad)}
.ev.done .t{color:var(--good);font-family:var(--mono);font-size:12px}
.tier{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);margin-right:6px}
.tier.allow{border-color:var(--good);color:var(--good)} .tier.prompt{border-color:var(--warn);color:var(--warn)} .tier.deny{border-color:var(--bad);color:var(--bad)}
.composer{border-top:1px solid var(--line);padding:12px 18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;background:var(--panel)}
textarea{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;resize:vertical;min-height:44px;max-height:200px}
.perm{border:1px solid var(--warn);background:#1d1a14;border-radius:8px;padding:12px 14px;margin:6px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.perm .h{color:var(--warn);font-weight:600}
.perm .d{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap;word-break:break-all}
.perm .b{display:flex;gap:8px}
.empty{color:var(--ink-3);padding:40px;text-align:center}
.tx{font-size:12.5px;color:var(--ink-2)}
.tx code{font-family:var(--mono);color:var(--accent)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-2)}
</style>
</head>
<body>
<header>
  <b>Genesis</b>
  <span class="badge local" id="badgeLocal">on this machine</span>
  <span class="badge" id="badgeModel">model: …</span>
  <span class="badge" id="badgeSandbox"></span>
  <span class="sp"></span>
  <label>Mode <select id="mode"><option value="assist">Assist (ask before writes)</option><option value="auto_edit" selected>Auto-edit (project writes allowed)</option><option value="autonomous">Autonomous (snapshots, still asks for system changes)</option></select></label>
  <input type="text" id="project" placeholder="project directory" size="34">
  <button id="newSession" class="primary">New session</button>
</header>
<main>
  <aside>
    <h3>Sessions</h3>
    <div id="sessions"></div>
    <div class="sp"></div>
    <div class="tx" id="txInfo"></div>
    <button id="undo" class="danger" style="display:none">Undo this session's changes</button>
    <p style="font-size:11.5px;color:var(--ink-3);margin:8px 0 0">Every tool call is checked by the permission broker before it runs. Anything at user or system scope is snapshotted first and can be undone.</p>
  </aside>
  <section>
    <div class="stream" id="stream"><div class="empty">Create a session, then describe what you want done in the project.</div></div>
    <div class="composer">
      <textarea id="prompt" placeholder="What should Genesis do? (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="send" class="primary" disabled>Send</button>
    </div>
  </section>
</main>
<script>
(function(){
  const $=s=>document.querySelector(s);
  let current=null, sessions={}, seen=0, poll=null;
  async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});return r.json();}
  async function health(){try{const h=await api('/api/health');$('#badgeModel').textContent='model: '+h.model;$('#badgeSandbox').textContent=h.sandbox?'sandbox: bubblewrap':'sandbox: dev mode (none)';if(!$('#project').value)$('#project').value=h.default_project||'';}catch(e){$('#badgeModel').textContent='model: unreachable'}}
  function renderSessions(){const box=$('#sessions');box.innerHTML='';const list=Object.values(sessions).sort((a,b)=>(b.created||0)-(a.created||0));if(!list.length){box.innerHTML='<div style="color:var(--ink-3);font-size:12.5px">none yet</div>';return}
    list.forEach(s=>{const d=document.createElement('div');d.className='sess'+(s.id===current?' sel':'');d.innerHTML=`<div>${s.mode||''} <span class="st st-${s.state||'idle'}">${s.state||'idle'}</span></div><div class="p">${s.project||''}</div>`;d.addEventListener('click',()=>select(s.id));box.appendChild(d)})}
  function evEl(e){const d=document.createElement('div');let cls='',icon='',text='';
    switch(e.kind){
      case 'user_prompt':cls='user';icon='▶';text=e.text;break;
      case 'assistant':cls='assistant';icon='💬';text=e.text;break;
      case 'tool_call':cls='tool';icon='🔧';text=e.name+' '+JSON.stringify(e.args).slice(0,300);break;
      case 'decision':cls='decision';icon='';d.innerHTML=`<div class="i"></div><div class="t"><span class="tier ${e.verdict.startsWith('allow')?'allow':e.verdict}">${e.tier} ${e.verdict}</span>${e.reason}</div>`;d.className='ev decision';return d;
      case 'tool_result':cls='result';icon=e.ok?'✓':'✗';text=e.summary;break;
      case 'waiting':cls='decision';icon='⏸';text='waiting for your permission: '+e.name;break;
      case 'resolved':cls='decision';icon='';text=e.allowed?'allowed':'denied';break;
      case 'snapshot':cls='snapshot';icon='⎘';text=e.tx+' '+e.detail;break;
      case 'error':cls='error';icon='‼';text=e.text;break;
      case 'done':cls='done';icon='■';text='done in '+e.turns+' turns';break;
      default:text=JSON.stringify(e);
    }
    d.className='ev '+cls;d.innerHTML=`<div class="i">${icon}</div><div class="t"></div>`;d.querySelector('.t').textContent=text;return d}
  function permEl(p){const d=document.createElement('div');d.className='perm';d.innerHTML=`<div><div class="h">Genesis wants to run <b>${p.tool}</b> · ${p.tier}</div><div class="d">${JSON.stringify(p.args,null,1)}</div><div class="d">${p.reason}</div></div><div class="b"><button data-a="0">Deny</button><button class="primary" data-a="1">Allow once</button></div>`;
    d.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{await api('/api/prompts/'+p.request_id,{allow:b.dataset.a==='1'});d.remove()}));return d}
  async function refresh(){if(!current)return;const s=await api('/api/sessions/'+current);if(s.error)return;sessions[current]={...sessions[current],...s};const st=$('#stream');
    if(seen===0)st.innerHTML='';
    for(let i=seen;i<s.events.length;i++){st.appendChild(evEl(s.events[i]))}
    if(s.events.length!==seen){seen=s.events.length;st.scrollTop=st.scrollHeight}
    document.querySelectorAll('.perm').forEach(x=>x.remove());
    (s.pending||[]).forEach(p=>{st.appendChild(permEl(p))});
    if(s.pending&&s.pending.length)st.scrollTop=st.scrollHeight;
    $('#send').disabled=(s.state==='running'||s.state==='waiting');
    $('#txInfo').innerHTML=s.transaction?`Transaction <code>${s.transaction}</code>: user/system-scope changes are snapshotted.`:'No user- or system-scope changes yet.';
    $('#undo').style.display=(s.transaction&&s.state!=='running'&&s.state!=='waiting')?'':'none';
    renderSessions()}
  function select(id){current=id;seen=0;$('#stream').innerHTML='';refresh();renderSessions();if(!poll)poll=setInterval(refresh,700)}
  $('#newSession').addEventListener('click',async()=>{const r=await api('/api/sessions',{mode:$('#mode').value,project:$('#project').value});if(r.error){alert(r.error);return}sessions[r.id]={id:r.id,mode:$('#mode').value,project:$('#project').value,state:'idle',created:Date.now()};select(r.id);$('#send').disabled=false;$('#prompt').focus()});
  async function send(){const t=$('#prompt').value.trim();if(!t||!current)return;$('#prompt').value='';$('#send').disabled=true;const r=await api('/api/sessions/'+current+'/prompt',{text:t});if(r.error){alert(r.error);$('#send').disabled=false}}
  $('#send').addEventListener('click',send);
  $('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  $('#undo').addEventListener('click',async()=>{if(!confirm('Undo every user- and system-scope change this session made?'))return;const r=await api('/api/sessions/'+current+'/undo');const st=$('#stream');const d=document.createElement('div');d.className='ev snapshot';d.innerHTML='<div class="i">↶</div><div class="t"></div>';d.querySelector('.t').textContent=(r.log||[r.error]).join('\n');st.appendChild(d);st.scrollTop=st.scrollHeight;$('#undo').style.display='none'});
  // launcher hand-off: /?prompt=...&project=...
  const q=new URLSearchParams(location.search);
  health().then(async()=>{if(q.get('project'))$('#project').value=q.get('project');if(q.get('prompt')){$('#newSession').click();setTimeout(()=>{$('#prompt').value=q.get('prompt');send()},300)}});
  renderSessions();
})();
</script>
</body>
</html>
